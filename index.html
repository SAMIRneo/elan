<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Élan ⚡ — muscu, cardio, streak</title>
<meta property="og:title" content="Élan ⚡ — muscu, cardio, streak">
<meta property="og:description" content="Ton carnet d'entraînement 100 % local : musculation, cardio, streak et badges.">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============ TOKENS ============ */
:root,[data-theme="dark"]{
  --bg:#0a0a0c;--bg2:#101013;--card:#16161a;--card2:#1e1e24;--card3:#26262e;
  --tx:#f4f4f6;--mut:#9a9aa4;--dim:#85858f;--line:#2b2b33;--line2:#3a3a44;
  --ac:#ccff00;--ac-text:#ccff00;--ac-tx:#0a0a0c;--ac-soft:rgba(204,255,0,.12);
  --ac2:#60a5fa;--ac2-text:#60a5fa;--ac2-soft:rgba(96,165,250,.12);
  --ok:#4ade80;--wa:#fbbf24;--bad:#f87171;--info:#60a5fa;
  --sh:0 8px 30px rgba(0,0,0,.35);
  --ol-gold:#f3c969;--ol-marble:#e7e2d8;--ol-laurel:#5f8a4d;--ol-bg:#1a1710;--ol-line:#4a3d22;--ol-tx:#eadfc4;--ol-shine:#fff2c4;
}
[data-theme="light"]{
  --bg:#f4f5f2;--bg2:#eaede6;--card:#fff;--card2:#f5f6f2;--card3:#eceee7;
  --tx:#14160f;--mut:#5c6155;--dim:#666b5f;--line:#dfe3d8;--line2:#c9cfbe;
  --ac:#7a9e00;--ac-text:#4a7d00;--ac-tx:#fff;--ac-soft:rgba(122,158,0,.12);
  --ac2:#2563eb;--ac2-text:#1d4ed8;--ac2-soft:rgba(37,99,235,.12);
  --ok:#16a34a;--wa:#b45309;--bad:#dc2626;--info:#2563eb;
  --sh:0 8px 30px rgba(40,50,20,.10);
  --ol-gold:#a67c1a;--ol-marble:#6b6355;--ol-laurel:#3f6b34;--ol-bg:#fbf6e8;--ol-line:#d9c793;--ol-tx:#4a3a12;--ol-shine:#8a6614;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(74px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:inherit}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.mono{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.04em}
/* ============ SHELL ============ */
header.top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 65%,transparent);padding:14px 0 8px}
.topin{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:22px;font-weight:900;letter-spacing:-.06em;display:flex;align-items:center;gap:6px}
.logo span{color:var(--ac)}
.topbtns{display:flex;gap:8px}
.icobtn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;position:relative}
.icobtn:active{transform:scale(.94)}
.dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--ac);border-radius:50%}
h1.page{font-size:30px;font-weight:900;letter-spacing:-.05em;margin:6px 0 2px}
.sub{color:var(--mut);font-size:13px}
/* ============ NAV ============ */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.navin{max-width:640px;margin:auto;display:flex;justify-content:space-around;align-items:stretch}
.nb{flex:1;min-width:0;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim);font-size:10px;font-weight:700}
.nb i{font-style:normal;font-size:20px;line-height:1}
.nb.on{color:var(--ac-text);background:var(--ac2-soft)}
.ac2{color:var(--ac2-text)}
.btn.sec{background:var(--ac2);color:var(--ac2-tx);border-color:transparent}
.nb.add i{background:var(--ac);color:var(--ac-tx);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:26px;font-weight:400;margin-top:-14px;box-shadow:var(--sh)}
/* ============ CARD / UI ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card.tight{padding:12px}
.card.flat{box-shadow:none;background:var(--card2)}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.10em;color:var(--mut);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.big{font-size:40px;line-height:1;font-weight:900;letter-spacing:-.06em}
.xbig{font-size:56px;line-height:1;font-weight:900;letter-spacing:-.07em}
.big span,.xbig span{letter-spacing:normal;margin-left:6px}
.muted{color:var(--mut)}.dim{color:var(--dim)}.tiny{font-size:12px}.small{font-size:13px}
.ac{color:var(--ac-text)}.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 11px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700}
.pill.ac{background:var(--ac-soft);border-color:transparent;color:var(--ac-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:14px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:var(--ac-tx);border-color:transparent}
.btn.gh{background:transparent}
.btn.sm{min-height:44px;padding:0 12px;font-size:12px;border-radius:11px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;min-height:44px;padding:0 12px;border-radius:10px;font-weight:800;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.seg.ac button.on{background:var(--ac);color:var(--ac-tx)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 5px}
input.f,select.f,textarea.f{width:100%;min-height:46px;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--ac)}
textarea.f{min-height:80px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:900;letter-spacing:-.04em}
.stat span{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty i{font-style:normal;font-size:40px;display:block;margin-bottom:8px}
.bar{height:8px;background:var(--card3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;font-size:16px}
.chk.on{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
/* ============ STREAK ============ */
.streak{display:flex;align-items:center;gap:16px}
.week{display:flex;gap:7px;margin-top:12px}
.day{flex:1;text-align:center}
.day i{font-style:normal;display:grid;place-items:center;width:100%;aspect-ratio:1;max-width:38px;margin:0 auto;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:15px}
.day.done i{background:var(--ac);color:var(--ac-tx);border-color:transparent}
.day.rest i{background:var(--info);color:#06122a;border-color:transparent}
.day.miss i{opacity:.35}
.day small{display:block;font-size:10px;color:var(--mut);margin-top:4px}
/* ============ HEATMAP ============ */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:10px;height:10px;border-radius:3px;background:var(--card3);display:block}
.heat i.l1{background:color-mix(in srgb,var(--ac) 30%,var(--card3))}
.heat i.l2{background:color-mix(in srgb,var(--ac2) 70%,var(--card3))}
.heat i.l3{background:var(--ac)}
.heat i.rs{background:var(--info)}
/* ============ MODAL / SHEET ============ */
#sheet{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
#sheet.open{display:flex}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;background:var(--line2);border-radius:9px;margin:6px auto 14px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-head h2{font-size:22px;font-weight:900;letter-spacing:-.04em}
/* ============ OLYMPE / PANTHEON ============ */
.olympe{background:var(--ol-bg);border-color:var(--ol-line);color:var(--ol-tx)}
.olympe .pill{background:transparent;border-color:var(--ol-line);color:var(--ol-gold)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.bitem{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 8px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.bitem:not(.got) .bart{color:var(--dim);opacity:.7}
.bitem.got{background:linear-gradient(120deg,color-mix(in srgb,var(--ol-gold) 16%,var(--card2)),var(--card2));border-color:var(--ol-gold)}
.bitem i{font-style:normal;font-size:20px;flex:none}
.bart{width:30px;height:30px;flex:none;color:var(--ol-gold)}
.bitem:not(.got) .bart{color:var(--mut)}
.bitem span{font-size:11px;font-weight:700;line-height:1.2}
.ptoggle.on{border-color:var(--ac)!important;background:var(--ac-soft)}
.ptoggle.on .chk{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
.bgroup+.bgroup{margin-top:14px}
.bgroup>h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ol-gold);margin-bottom:4px}
.bcount{font-size:10px;color:var(--mut);font-weight:700}
.rank{background:linear-gradient(120deg,var(--ol-gold),var(--ol-shine));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
/* ============ BOUTIQUE / COSMÉTIQUES ============ */
.shop-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.shop-item:last-child{border-bottom:0}
.shop-ic{width:52px;height:52px;border-radius:14px;background:var(--card2);border:1px solid var(--line);overflow:hidden;flex:none;position:relative}
.shop-ic img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) contrast(1.08)}
.shop-ic::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.42));pointer-events:none}
.shop-item.owned .shop-ic{border-color:color-mix(in srgb,var(--ol-gold) 65%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--ol-gold) 22%,transparent)}
.gempill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 10px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:900;color:var(--ol-gold)}
.ttag{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:linear-gradient(120deg,var(--ol-gold),#fff2c4);color:#241a06;vertical-align:middle;margin-left:6px}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;flex:none}
.avatar.lg{width:60px;height:60px;border-radius:18px;font-size:30px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:14px}
.avatar.lg img{border-radius:18px}
.avatarpick{width:56px;height:56px;border-radius:15px;overflow:hidden;border:2px solid var(--line);padding:0;background:var(--card2);display:grid;place-items:center;flex:none}
.avatarpick img{width:100%;height:100%;object-fit:cover;display:block}
.avatarpick.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-soft)}
.pick-wrap{position:relative;flex:none}
.pick-del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid var(--card);z-index:1}
.avatarpick.silhouette{color:var(--mut)}
.avatarpick.silhouette .avatar{border:0;width:36px;height:36px}
.avatarpick.silhouette .avatar::before{display:none}
.avatar.frame-gold{border:2px solid var(--ol-gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--ol-gold) 22%,transparent),0 0 14px color-mix(in srgb,var(--ol-gold) 30%,transparent)}
.avatar.frame-laurel{border:2px solid var(--ol-laurel);box-shadow:0 0 0 3px color-mix(in srgb,var(--ol-laurel) 28%,transparent)}
.avatar.frame-volt{border:2px solid var(--ac);box-shadow:0 0 0 2px var(--ac-soft),0 0 16px var(--ac)}
button.banner{display:block;width:calc(100% + 28px);padding:0;text-align:left;cursor:pointer}
.banner{height:82px;border-radius:0 0 18px 18px;position:relative;overflow:hidden;margin:0 -14px 12px;border-bottom:1px solid var(--line)}
.banner::after{content:'';position:absolute;inset:0;opacity:.25}
.banner-stade{background:linear-gradient(180deg,rgba(10,10,12,.22),rgba(10,10,12,.72)),url('assets/cos-banner-stade.jpg') center/cover no-repeat}
.banner-stade::after{background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(255,255,255,.07) 26px 28px)}
.banner-temple{background:linear-gradient(180deg,rgba(26,23,16,.18),rgba(26,23,16,.72)),url('assets/cos-banner-temple.jpg') center/cover no-repeat}
.banner-temple::after{background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(243,201,105,.13) 12px 14px)}
.banner-neon{background:linear-gradient(180deg,rgba(10,10,12,.72),rgba(10,10,12,.62)),url('assets/cos-banner-neon.jpg') center 65%/cover no-repeat}
.banner-neon::after{background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.05) 5px 6px)}
/* ============ EFFETS VISUELS ============ */
.flame{position:relative;display:grid;place-items:center;width:64px;height:64px;flex:none;font-size:54px;line-height:1;filter:drop-shadow(0 4px 12px rgba(204,255,0,.25))}
.flame-fx{position:relative;display:block;width:54px;height:54px}
.flame-fx svg{display:block;transform-origin:50% 85%;animation:flick 1.5s ease-in-out infinite alternate;filter:drop-shadow(0 0 9px var(--fglow))}
@keyframes flick{
  0%{transform:scale(1) skewX(0) rotate(-2deg);filter:drop-shadow(0 0 7px var(--fglow))}
  45%{transform:scale(1.09,.93) skewX(3deg) rotate(1deg)}
  100%{transform:scale(.95,1.07) skewX(-3deg) rotate(-1deg);filter:drop-shadow(0 0 18px var(--fglow))}
}
.fx-rainbow svg{animation:flick 1.5s ease-in-out infinite alternate, hue 6s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg) drop-shadow(0 0 12px var(--fglow))}}
.sp{position:absolute;left:50%;top:62%;width:4px;height:4px;border-radius:50%;background:var(--sc);box-shadow:0 0 7px var(--sc);opacity:0;pointer-events:none;animation:spark 1.7s ease-out infinite}
.sp.s2{left:36%;animation-delay:.34s}.sp.s3{left:64%;animation-delay:.68s}
.sp.s4{left:44%;animation-delay:1.02s}.sp.s5{left:57%;animation-delay:1.36s}
@keyframes spark{0%{transform:translate(0,0) scale(.4);opacity:0}18%{opacity:1}100%{transform:translate(var(--dx),-44px) scale(0);opacity:0}}
/* cadres animés */
.avatar{position:relative}
.avatar::before{content:'';position:absolute;inset:-6px;border-radius:19px;padding:3px;pointer-events:none;opacity:0}
.avatar.lg::before{inset:-9px;border-radius:26px}
.avatar.frame-gold::before{opacity:1;background:conic-gradient(from 0deg,#a86b12,#fff2c4,#f3c969,#fff2c4,#a86b12);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 4s linear infinite}
.avatar.frame-laurel::before{opacity:1;inset:-17px;border-radius:0;padding:0;background:url('assets/laurel-gold.svg') center/contain no-repeat;-webkit-mask:none;mask:none;animation:laurelGlow 3s ease-in-out infinite alternate;filter:drop-shadow(0 0 5px rgba(243,201,105,.5))}
.avatar.lg.frame-laurel::before{inset:-24px}
@keyframes laurelGlow{from{filter:drop-shadow(0 0 3px rgba(243,201,105,.25))}to{filter:drop-shadow(0 0 10px rgba(243,201,105,.65))}}
.avatar.frame-volt::before{opacity:1;background:conic-gradient(from 0deg,transparent,var(--ac),transparent,var(--ac),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 2.4s linear infinite,volt 1.5s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes volt{from{filter:drop-shadow(0 0 2px var(--ac))}to{filter:drop-shadow(0 0 9px var(--ac))}}
/* titres avec balayage lumineux */
.ttag{position:relative;overflow:hidden}
.ttag::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);transform:translateX(-130%);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
/* bannières en mouvement */
.banner::before{content:'';position:absolute;inset:-60%;pointer-events:none;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.20) 50%,transparent 60%);animation:sweep 5s linear infinite}
.banner-stade::before{animation-duration:6s}
.banner-temple::before{background:linear-gradient(110deg,transparent 35%,rgba(243,201,105,.32) 50%,transparent 65%);animation-duration:4.5s}
.banner-neon::before{background:linear-gradient(110deg,transparent 32%,rgba(204,255,0,.34) 50%,transparent 68%);animation-duration:2.8s}
.banner-neon::after{animation:neonPulse 2.2s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateX(-45%)}to{transform:translateX(45%)}}
@keyframes neonPulse{from{opacity:.15}to{opacity:.45}}
/* particules de célébration */
#fx{position:fixed;inset:0;z-index:300;pointer-events:none;overflow:hidden}
.pt{position:absolute;font-style:normal;font-size:18px;line-height:1;transform:translate(-50%,-50%);animation:burst .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0)}
  14%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}
}
/* bas de gamme / petit écran : on garde l'identité, on coupe le superflu */
@media (max-width:480px){
  .sp{display:none}
  .avatar::before,.ttag::after,.banner::before,.banner::after{animation:none!important}
  .flame-fx svg,.flame-fx.fx-rainbow svg{animation:flick 2.2s ease-in-out infinite alternate}
  .banner::before{opacity:.4}
}
@media (prefers-reduced-motion:reduce){
  .flame-fx svg,.sp,.avatar::before,.ttag::after,.banner::before,.banner::after,.pt,.sheet,.btn,.icobtn,.nb.add i{animation:none!important;transition:none!important}
  .sp{display:none}
}
/* ============ MISC ============ */
.exo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.exo-item:last-child{border-bottom:0}
.exo-item .nm{flex:1;font-weight:700;min-width:0}

const $= (s,r=document)=>r.querySelector(s);

const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ymd(d=new Date()){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function dayAdd(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function fmtDate(s,o={}){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',o)}
function fmtMin(m){m=Math.round(m||0);return m>=60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):m+' min'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function confirm2(msg){return window.confirm(msg)}
function burst(kind='gem',x=window.innerWidth/2,y=window.innerHeight*.35){
  const layer=$('#fx');if(!layer)return;
  const emo={gem:'💎',spark:'✨',laurel:'🌿',volt:'⚡'}[kind]||'✨';
  for(let i=0;i<20;i++){
    const p=document.createElement('i');p.className='pt';p.textContent=emo;
    const a=Math.random()*Math.PI*2,r=55+Math.random()*100;
    p.style.left=x+'px';p.style.top=y+'px';
    p.style.setProperty('--dx',Math.round(Math.cos(a)*r)+'px');
    p.style.setProperty('--dy',Math.round(Math.sin(a)*r-45)+'px');
    p.style.setProperty('--rot',Math.round(Math.random()*720-360)+'deg');
    p.style.animationDelay=(Math.random()*.12)+'s';
    p.style.fontSize=(13+Math.random()*11)+'px';
    layer.appendChild(p);
    setTimeout(()=>p.remove(),1150);
  }
}

function demoData(){

  let kg=60;
  for(let i=20;i>=0;i--){
    const date=dayAdd(ymd(),-i);
    if(i%3!==0){
      const id=ids[i%ids.length],e=MUSCU_EXOS.find(x=>x.id===id)||{nom:'Développé couché'};
      kg+=1;
      const item={id,nom:e.nom,kg,reps:8+(i%3),series:4};
      d.activities.push({id:uid(),date,type:'muscu',program:i%2?'Push':'Pull',exos:[item],note:'',avis:4,duree:50});
      d.measurements.push({id:uid(),date,sport:'muscu',exo:e.nom,mesure:'kg',valeur:kg});
      d.measurements.push({id:uid(),date,sport:'muscu',exo:e.nom,mesure:'répétitions',valeur:item.reps});
      d.measurements.push({id:uid(),date,sport:'muscu',exo:e.nom,mesure:'séries',valeur:4});
      d.records.push({date,exo:e.nom,mesure:'kg',valeur:kg});
    }else{
      const m=modes[(i/3|0)%modes.length],cfg=CARDIO.find(c=>c.id===m);
      d.activities.push({id:uid(),date,type:'cardio',mode:m,duree:30+(i%4)*5,distance:cfg.dist?5+(i%5):0,tours:0,note:'',avis:5});
    }
  }
  for(let i=7;i>=0;i--)d.weights.push({date:dayAdd(ymd(),-i*3),kg:Math.round((80-(7-i)*.35)*10)/10});
  for(let i=0;i<14;i++){

    d.challenges[date]=[ch.id];d.gemLog.push({date,id:ch.id});

  d.cosmetics={owned:SHOP.map(x=>x.id),equipped:{flame:'flame-rainbow',title:'title-olympe',frame:'frame-volt',banner:'banner-neon'}};
  d.gems=99;d.streak={best:21,rest:[]};
  return d;
}

/* Validation stricte : reconstruit un objet propre, jamais d'assignation directe */
function sanitizeData(o){
  if(!o||typeof o!=='object'||Array.isArray(o)||o.v!==4||!o.profile||typeof o.profile!=='object')return null;
  const d=blank();
  const S=(v,n=120)=>typeof v==='string'?v.slice(0,n):'';
  const N=(v,def,min,max)=>{const x=Number(v);return Number.isFinite(x)?clamp(x,min,max):def};
  const A=v=>Array.isArray(v)?v.slice(0,4000):[];
  const Dt=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:ymd();
  const p=o.profile;
  d.profile={
    prenom:S(p.prenom,40),sexe:p.sexe==='femme'?'femme':'homme',
    age:N(p.age,28,10,120),taille:N(p.taille,175,100,230),poids:N(p.poids,75,20,400),
    objectif:S(p.objectif,80)||'Progresser',
    rythme:{muscu:N(p.rythme?.muscu,3,0,14),cardio:N(p.rythme?.cardio,2,0,14)},
    photo:typeof p.photo==='string'&&p.photo.length<400000&&/^(data:image\/(jpeg|png|webp);base64,|assets\/)/.test(p.photo)?p.photo:'',
    photos:Array.isArray(p.photos)?p.photos.filter(x=>typeof x==='string'&&x.length<400000&&/^data:image\/(jpeg|png|webp);base64,/.test(x)).slice(0,8):[]
  };
  d.activities=A(o.activities).filter(x=>x&&typeof x==='object').map(x=>({
    id:S(x.id,40)||uid(),date:Dt(x.date),type:x.type==='cardio'?'cardio':'muscu',
    mode:S(x.mode,30)||'course',program:S(x.program,40),duree:N(x.duree,0,0,1440),
    distance:N(x.distance,0,0,2000),tours:N(x.tours,0,0,10000),note:S(x.note,300),avis:N(x.avis,0,0,5),
    exos:A(x.exos).filter(e=>e&&typeof e==='object').map(e=>({id:S(e.id,40),nom:S(e.nom,80),kg:S(e.kg,20),reps:S(e.reps,20),series:S(e.series,20),note:S(e.note,200)})),
    mids:A(x.mids).map(String),rids:A(x.rids).map(String)
  }));
  d.weights=A(o.weights).filter(x=>x&&typeof x==='object').map(x=>({date:Dt(x.date),kg:N(x.kg,75,20,400)}));
  d.measurements=A(o.measurements).filter(x=>x&&typeof x==='object').map(x=>({
    id:S(x.id,40)||uid(),date:Dt(x.date),sport:x.sport==='cardio'?'cardio':'muscu',
    exo:S(x.exo,80),mesure:S(x.mesure,20),valeur:N(x.valeur,0,-10000,100000)
  }));
  d.records=A(o.records).filter(x=>x&&typeof x==='object').map(x=>({date:Dt(x.date),exo:S(x.exo,80),mesure:S(x.mesure,20),valeur:N(x.valeur,0,-10000,100000)}));
  d.customExos=A(o.customExos).filter(x=>x&&typeof x==='object'&&x.nom).map(x=>({id:S(x.id,40)||uid(),nom:S(x.nom,80),grp:S(x.grp,40),cat:['warm','exos','stretch'].includes(x.cat)?x.cat:'exos',custom:true}));
  d.programs=A(o.programs).filter(x=>x&&x.nom&&Array.isArray(x.exos)).map(x=>({id:S(x.id,40)||uid(),nom:S(x.nom,40),ic:S(x.ic,4)||'💪',exos:A(x.exos).map(String).slice(0,40)}));
  if(!d.programs.length)d.programs=JSON.parse(JSON.stringify(DEF_PROGRAMS));
  d.moods={};for(const k of Object.keys(o.moods||{}))if(/^\d{4}-\d{2}-\d{2}$/.test(k))d.moods[k]=N(o.moods[k],0,1,5);
  d.challenges={};for(const k of Object.keys(o.challenges||{}))if(/^\d{4}-\d{2}-\d{2}$/.test(k))d.challenges[k]=A(o.challenges[k]).map(String).slice(0,20);
  const n=o.nutrition||{};

function shade(hex,n){
  const v=parseInt(hex.slice(1),16);
  return '#'+[16,8,0].map(s=>clamp(((v>>s)&255)+n,0,255).toString(16).padStart(2,'0')).join('');
}
function luminance(hex){
  const ch=[16,8,0].map(s=>{const v=((parseInt(hex.slice(1),16)>>s)&255)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return ch[0]*.2126+ch[1]*.7152+ch[2]*.0722;
}
function themeColor(raw,dark){
  const lum=luminance(raw);
  const c=!dark&&lum>.38?shade(raw,-72):dark&&lum<.07?shade(raw,64):raw;
  let t=c;
  if(!dark){let guard=0;while(luminance(t)>.18&&guard++<20)t=shade(t,-12)}
  return {c,text:dark?c:t};
}
function applyTheme(){
  const dark=(D?.settings.theme||'dark')==='dark';
  const r=document.documentElement;
  const a=themeColor(D?.settings.accent||'#ccff00',dark);
  const b=themeColor(D?.settings.accent2||'#60a5fa',dark);
  r.dataset.theme=D?.settings.theme||'dark';
  r.style.setProperty('--ac',a.c);
  r.style.setProperty('--ac-soft',dark?a.c+'20':a.c+'18');
  r.style.setProperty('--ac-tx',luminance(a.c)<.183?'#fff':'#0a0a0c');
  r.style.setProperty('--ac-text',a.text);
  r.style.setProperty('--ac2',b.c);
  r.style.setProperty('--ac2-soft',dark?b.c+'20':b.c+'18');
  r.style.setProperty('--ac2-tx',luminance(b.c)<.183?'#fff':'#0a0a0c');
  r.style.setProperty('--ac2-text',b.text);
  document.querySelector('meta[name=theme-color]')?.setAttribute('content',dark?'#0a0a0c':'#f4f5f2');
}

function detectRecords(items){
  return items.filter(it=>{
    const prev=D.measurements.filter(m=>m.id!==it.id&&m.exo===it.exo&&m.mesure===it.mesure&&m.date<ymd());
    if(!prev.length)return false; // première mesure = référence, pas un record
    const mx=Math.max(...prev.map(m=>m.valeur));
    return it.valeur>mx;
  }).map(({exo,mesure,valeur})=>({exo,mesure,valeur}));
}
function weeklyMinutes(){return D.activities.filter(a=>a.date>=dayAdd(ymd(),-6)).reduce((s,a)=>s+(a.duree||0),0)}
function badgeDefs(){
  const out=[];
  const add=(sp,k,i,t,ok)=>out.push({id:sp+'-'+k+i,kind:k,level:i,art:badgeArt(k,i),t,ok});
  ['muscu','cardio'].forEach(sp=>{
    const label=sp==='muscu'?'muscu':'cardio';
    [10,25,50,100].forEach((n,i)=>add(sp,'n',i+1,`${n} séances ${label}`,()=>D.activities.filter(a=>a.type===sp).length>=n));
    [3,7,14,30].forEach((n,i)=>add(sp,'s',i+1,`Streak de ${n} jours`,()=>currentStreak()>=n&&D.activities.some(a=>a.type===sp)));
    if(sp==='muscu'){
      [1000,5000,10000,25000].forEach((n,i)=>add(sp,'v',i+1,`${n>=1000?(n/1000)+' t soulevée':n+' kg soulevés'}`,()=>volumeKg()>=n));
    }else{
      [10,25,50,100].forEach((n,i)=>add(sp,'v',i+1,`${n} km cumulés`,()=>volumeKm()>=n));
    }
    [1,5,15,30].forEach((n,i)=>add(sp,'r',i+1,`${n} record${n>1?'s':''} battu${n>1?'s':''}`,()=>(D.records||[]).length>=n));
    [[2,2],[3,4],[4,8],[5,12]].forEach(([n,w],i)=>add(sp,'g',i+1,`${n} séances/sem. pendant ${w} sem.`,()=>bestWeeklyRun(n)>=w));

}

function weekKey(date){
  const d=new Date(date+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);
}
function bestWeeklyRun(min){
  const weeks={};
  D.activities.forEach(a=>{const k=weekKey(a.date);weeks[k]=(weeks[k]||0)+1});
  let run=0,best=0,cur=weekKey(ymd());
  for(let i=0;i<52;i++){
    if((weeks[cur]||0)>=min){run++;best=Math.max(best,run)}else run=0;

  }

}

/* ---------- Progrès ---------- */
VIEWS.progres=()=>{
  const mus=D.activities.filter(a=>a.type==='muscu').length,car=D.activities.filter(a=>a.type==='cardio').length;
  const total=mus+car,w=total?mus/total*100:50;
  const heat=buildHeat();
  const sport=SUB.psport||'muscu';
  const exos=[...new Set(D.measurements.filter(m=>m.sport===sport).map(m=>m.exo))];
  const exo=SUB.pexo||exos[0]||'';
  const mesures=[...new Set(D.measurements.filter(m=>m.sport===sport&&m.exo===exo).map(m=>m.mesure))];
  const mes=SUB.pmes||mesures[0]||'';
  const pts=D.measurements.filter(m=>m.sport===sport&&m.exo===exo&&m.mesure===mes).slice(-12);
  const weights=D.weights.slice(-12);
  return `<h1 class="page">Progrès 📈</h1><p class="sub">Ta régularité et tes records, en un coup d'œil.</p>
  <div class="grid3" style="margin:14px 0">
    <div class="stat"><b class="ac mono">${currentStreak()}</b><span>streak</span></div>
    <div class="stat"><b class="mono">${fmtMin(weeklyMinutes())}</b><span>7 jours</span></div>
    <div class="stat"><b class="mono">${total}</b><span>séances</span></div>
  </div>
  <div class="card"><b class="small">Régularité — 16 semaines</b><div class="heat" style="margin-top:10px">${heat}</div>
    <div class="row tiny muted" style="justify-content:flex-end;gap:5px;margin-top:6px">moins <i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--card3)"></i><i style="width:10px;height:10px;border-radius:3px;background:var(--ac);opacity:.35"></i><i style="width:10px;height:10px;border-radius:3px;background:var(--ac);opacity:.7"></i><i style="width:10px;height:10px;border-radius:3px;background:var(--ac)"></i> plus</div>
  </div>
  <div class="card"><b class="small">Répartition</b>
    <div class="row" style="margin:10px 0 8px"><div style="width:${w}%;height:10px;background:var(--ac);border-radius:99px 0 0 99px"></div><div style="width:${100-w}%;height:10px;background:var(--info);border-radius:0 99px 99px 0"></div></div>
    <div class="row between small"><span class="ac">🏋️ Muscu ${mus}</span><span class="muted">${total?Math.round(w)+'%':''}</span><span style="color:var(--info)">Cardio ${car} 🏃</span></div>
  </div>
  <div class="card"><div class="row between"><b class="small">⚖️ Mon poids</b><span class="pill mono">${D.profile.poids} kg</span></div>
    ${weightChart(weights)}
    <div class="row" style="margin-top:10px"><input class="f" id="poids-input" type="number" inputmode="decimal" placeholder="Nouvelle pesée (kg)" style="flex:1">
      <button class="btn pri" data-act="add-poids">Ajouter</button></div>
    <div class="tiny muted" style="margin-top:8px">IMC : <b>${imc()}</b> — ${imcTxt()}</div>
  </div>
  <div class="card"><b class="small">📈 Progression exercice</b>
    <div class="seg" style="margin:10px 0">${['muscu','cardio'].map(s=>`<button class="${sport===s?'on':''}" data-act="psport" data-v="${s}">${s==='muscu'?'🏋️ Muscu':'🏃 Cardio'}</button>`).join('')}</div>
    ${exos.length?`<select class="f" data-act="pexo">${exos.map(e=>`<option ${e===exo?'selected':''}>${esc(e)}</option>`).join('')}</select>
      <div class="seg" style="margin:8px 0;flex-wrap:wrap">${mesures.map(m=>`<button class="${mes===m?'on':''}" data-act="pmes" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>
      ${lineChart(pts)}
      <div class="tiny muted" style="margin-top:8px">Dernières mesures</div>
      ${pts.slice().reverse().slice(0,6).map(m=>`<div class="row between small" style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">${fmtDate(m.date)}</span><b class="mono">${m.valeur}</b></div>`).join('')}
    `:'<div class="empty tiny">Enregistre des mesures depuis une séance muscu ou cardio pour voir ta progression ici.</div>'}
  </div>`;
};
function buildHeat(){
  const out=[],start=dayAdd(weekKey(ymd()),-7*15);
  for(let i=0;i<112;i++){const x=dayAdd(start,i);
    const n=D.activities.filter(a=>a.date===x).length;
    let c='';if(D.streak.rest.includes(x))c='rs';else if(n>=3)c='l3';else if(n===2)c='l2';else if(n===1)c='l1';
    out.push(`<i class="${c}" title="${x}"></i>`)}
  return out.join('');
}
function imc(){const h=(D.profile.taille||175)/100;return (D.profile.poids/(h*h)).toFixed(1)}
function imcTxt(){const v=+imc();return v<18.5?'Insuffisance':v<25?'Zone normale':v<30?'Surpoids':'Obésité'}
function weightChart(pts){
  if(pts.length<2)return `<div class="empty tiny">Ajoute au moins 2 pesées pour voir la courbe.</div>`;
  const vs=pts.map(p=>p.kg),min=Math.min(...vs)-.5,max=Math.max(...vs)+.5,rng=max-min||1;
  const w=280,h=70;const xy=vs.map((v,i)=>[i/(vs.length-1)*w,h-(v-min)/rng*h]);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:80px;margin-top:8px;overflow:visible"><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ac)"/>`).join('')}</svg>
  <div class="row between tiny muted"><span>${pts[0].kg} kg</span><span>${pts[pts.length-1].kg} kg</span></div>`;
}
function lineChart(pts){
  if(pts.length<2)return `<div class="empty tiny">Pas assez de mesures pour tracer une courbe.</div>`;
  const vs=pts.map(p=>p.valeur),min=Math.min(...vs)*.95,max=Math.max(...vs)*1.05||1,rng=max-min||1;
  const w=280,h=70;const xy=vs.map((v,i)=>[i/(vs.length-1)*w,h-(v-min)/rng*h]);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:80px;margin-top:10px;overflow:visible"><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ac)"/>`).join('')}</svg>
  <div class="row between tiny muted"><span>${pts[0].valeur}</span><span>${pts[pts.length-1].valeur}</span></div>`;
}

    <div><label class="f">Durée des règles (jours)</label><input class="f" id="cy-reg" type="number" value="5"></div></div>
    <button class="btn pri block" style="margin-top:12px" data-act="cysave">Enregistrer</button></div>`;
  const diff=Math.floor((new Date(ymd())-new Date(c.debut))/86400000);
  const day=((diff%c.longueur)+c.longueur)%c.longueur+1;
  let phase,conseil,ic;
  if(day<=c.regles){phase='Règles';conseil='Récupération et mouvements doux. Écoute ton corps.';ic='🩸'}
  else if(day<=c.longueur/2){phase='Phase folliculaire';conseil='Énergie montante : cale-toi les séances intenses.';ic='🌱'}
  else if(day<=c.longueur/2+2){phase='Ovulation';conseil='Pic d’énergie : PR et charges lourdes possibles.';ic='✨'}
  else{phase='Phase lutéale';conseil='Ralentis progressivement, privilégie le cardio modéré.';ic='🌙'}
  const y=SUB.cyYear||new Date().getFullYear(),m=SUB.cyMonth??new Date().getMonth();
  return `<h1 class="page">Cycle 🌙</h1><p class="sub">Jour ${day} · ${phase}</p>
  <div class="card"><div class="row"><div style="font-size:44px">${ic}</div><div class="grow"><div class="rank" style="font-size:22px">${phase}</div><div class="small muted" style="margin-top:4px">${conseil}</div></div></div>
    <div class="bar" style="margin-top:12px"><i style="width:${day/c.longueur*100}%"></i></div>
    <div class="row between tiny muted" style="margin-top:5px"><span>J1</span><span>J${c.longueur}</span></div>
  </div>
  <div class="card"><div class="row between"><b class="small">Calendrier</b><div class="row"><button class="btn sm" data-act="cym" data-v="-1">‹</button><button class="btn sm" data-act="cym" data-v="1">›</button></div></div>
    ${calendar(y,m)}</div>
  <div class="card"><b class="small">Réglages</b>
    <div class="grid2"><div><label class="f">Début</label><input class="f" id="cy-debut" type="date" value="${c.debut}"></div>
      <div><label class="f">Longueur</label><input class="f" id="cy-long" type="number" value="${c.longueur}"></div></div>
    <button class="btn block" style="margin-top:8px" data-act="cysave">Mettre à jour</button></div>`;
};
function calendar(y,m){
  const first=new Date(y,m,1).getDay()||7,days=new Date(y,m+1,0).getDate();
  let h='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px">';
  ['L','M','M','J','V','S','D'].forEach(x=>h+=`<div class="tiny dim">${x}</div>`);
  for(let i=1;i<first;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const diff=Math.floor((new Date(ds)-new Date(D.cycle.debut))/86400000);
    const cd=((diff%D.cycle.longueur)+D.cycle.longueur)%D.cycle.longueur+1;
    let bg='';if(cd<=D.cycle.regles)bg='background:color-mix(in srgb,var(--bad) 28%,var(--card2))';
    else if(cd>D.cycle.longueur/2&&cd<=D.cycle.longueur/2+2)bg='background:color-mix(in srgb,var(--wa) 28%,var(--card2))';
    h+=`<div class="tiny" style="aspect-ratio:1;display:grid;place-items:center;border-radius:9px;${bg};${ds===ymd()?'outline:2px solid var(--ac)':''}">${d}</div>`;
  }
  return h+'</div>';
}

/* ============ MODALES ============ */
function openSheet(title,html){
  const prev=document.activeElement;
  $('#sheet').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grab"></div><div class="sh-head"><h2 id="sheet-title">${esc(title)}</h2><button class="icobtn" data-act="close" aria-label="Fermer">✕</button></div>${html}</div>`;
  $('#sheet').classList.add('open');
  $('#sheet').dataset.return=prev?.id||'';
  requestAnimationFrame(()=>$('#sheet').querySelector('button,input,select,textarea')?.focus());
}
function closeSheet(){
  const was=$('#sheet').classList.contains('open'),ret=$('#sheet').dataset.return;
  $('#sheet').classList.remove('open');
  setTimeout(()=>{if(!$('#sheet').classList.contains('open'))$('#sheet').innerHTML=''},200);
  if(was&&ret)document.getElementById(ret)?.focus();
}
function commit(){syncBadges();save();render()}
function val(id){return $(id)?.value??''}

/* ============ HANDLERS ============ */
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){closeSheet();navigate(go.dataset.go);return}
  const sub=e.target.closest('[data-sub]');
  if(sub){SUB[sub.dataset.sub]=sub.dataset.v;render();return}
  const a=e.target.closest('[data-act]');
  if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,v=a.dataset.v;
  switch(act){
    case 'close':closeSheet();break;
    case 'theme':D.settings.theme=D.settings.theme==='dark'?'light':'dark';commit();break;
    case 'settheme':D.settings.theme=v;commit();break;
    case 'more':moreSheet();break;
    case 'compte':accountSheet();break;
    case 'buy':{
      const it=shopItem(id);
      if(!it){break}
      if((D.gems||0)<it.price){toast(`Il te manque ${it.price-(D.gems||0)} 💎`);break}
      D.gems-=it.price;
      D.cosmetics.owned=D.cosmetics.owned||[];
      if(!D.cosmetics.owned.includes(id))D.cosmetics.owned.push(id);
      D.cosmetics.equipped[it.cat]=id;
      burst('spark');commit();toast(`${it.nom} acheté et équipé ✨`);break;
    }
    case 'equip':{
      const it=shopItem(id);
      if(!it||!(D.cosmetics.owned||[]).includes(id)){toast('Objet non possédé');break}
      D.cosmetics.equipped[it.cat]=id;commit();toast('Équipé');break;
    }
    case 'unequip':{
      D.cosmetics.equipped[a.dataset.cat]='';commit();toast('Cosmétique retiré');break;
    }
    case 'accent':D.settings.accent=v;commit();break;
    case 'accent2':D.settings.accent2=v;commit();break;
    case 'duo':D.settings.accent=a.dataset.a;D.settings.accent2=a.dataset.b;commit();toast('Duo appliqué');break;
    case 'rest':{
      const t=ymd(),i=D.streak.rest.indexOf(t);
      if(i>=0)D.streak.rest.splice(i,1);else D.streak.rest.push(t);
      D.streak.best=Math.max(D.streak.best,currentStreak());commit();
      toast(i>=0?'Jour de repos retiré':'Jour de repos noté 😴');break;
    }
    case 'reset-streak':
      if(confirm2('Effacer tous les jours de repos et recalculer le record ?')){D.streak.rest=[];D.streak.best=currentStreak();commit();toast('Streak réinitialisé')}
      break;
    case 'valid-defi':{
      const t=ymd(),ch=challengeOfDay();
      D.challenges[t]=D.challenges[t]||[];
      const i=D.challenges[t].indexOf(ch.id);
      if(i>=0){D.challenges[t].splice(i,1);toast('Validation retirée (gem conservée)')}
      else{
        D.challenges[t].push(ch.id);
        if(!D.gemLog.some(g=>g.date===t&&g.id===ch.id)){
          D.gemLog.push({date:t,id:ch.id});D.gems=(D.gems||0)+1;
          burst('gem');toast('Défi validé · +1 💎');
        }
        else{toast('Défi validé');burst('spark')}
      }
      commit();break;
    }
    case 'mood':D.moods[ymd()]=+v;commit();toast('Humeur notée');break;
    case 'new':openSheet('Nouvelle activité',`
      <div class="grid2">
        <button class="card" style="margin:0;text-align:left" data-go="muscu"><div style="font-size:32px">🏋️</div><b>Musculation</b><div class="tiny muted">Charges · reps · séries</div></button>
        <button class="card" style="margin:0;text-align:left" data-go="cardio"><div style="font-size:32px">🏃</div><b>Cardio</b><div class="tiny muted">Course · vélo · HIIT</div></button>
      </div>
      <button class="btn block" style="margin-top:10px" data-act="measure-open">📊 Mesurer un exercice</button>`);break;
    case 'del-act':
      if(confirm2('Supprimer cette activité ?')){
        const target=D.activities.find(x=>x.id===id);
        if(target?.mids)D.measurements=D.measurements.filter(m=>!target.mids.includes(m.id));
        if(target?.rids)D.records=D.records.filter(r=>!target.rids.includes(r.id));
        D.activities=D.activities.filter(x=>x.id!==id);
        commit();toast('Activité supprimée');
      }break;
    /* --- muscu --- */
    case 'wprog':syncWorkout();{
      const p=D.programs.find(x=>x.id===id);
      EDIT.workout={prog:id,exos:p?p.exos.map(x=>{const e=exoById(x);return {id:x,nom:e?.nom||x,kg:'',reps:'',series:''}}):[]};
      render();break;
    }
    case 'wrm':syncWorkout();EDIT.workout.exos.splice(+a.dataset.i,1);render();break;
    case 'wadd':syncWorkout();openExoPicker();break;
    case 'surcharge':syncWorkout();if(applyOverload(+a.dataset.i)){render();toast('Surcharge appliquée ⚡')}else toast('Pas encore d’historique pour cet exo');break;
    case 'surcharge-all':syncWorkout();{
      let n=0;EDIT.workout.exos.forEach((_,i)=>{if(applyOverload(i))n++});
      render();toast(n?`Surcharge appliquée à ${n} exo${n>1?'s':''} ⚡`:'Pas encore d’historique');
      break;
    }
    case 'wavis':EDIT.wAvis=+v;render();break;
    case 'wreset':EDIT.workout=null;EDIT.wNote='';EDIT.wAvis=0;render();break;
    case 'wsave':saveWorkout();break;
    case 'pick-exo':syncWorkout();{
      const e=exoById(id);if(e&&!EDIT.workout.exos.some(x=>x.id===e.id))EDIT.workout.exos.push({id:e.id,nom:e.nom,kg:'',reps:'',series:''});
      closeSheet();render();break;
    }
    /* --- programmes --- */
    case 'pnew':openProgramEditor(null);break;
    case 'pedit':openProgramEditor(D.programs.find(p=>p.id===id));break;
    case 'pdel':
      if(confirm2('Supprimer ce programme ?')){D.programs=D.programs.filter(p=>p.id!==id);if(EDIT.workout?.prog===id)EDIT.workout=null;commit()}break;
    case 'psaveProg':saveProgram();break;
    case 'ptoggle':a.classList.toggle('on');break;
    /* --- cardio --- */
    case 'cmode':EDIT.cmode=id;render();break;
    case 'cavis':EDIT.cAvis=+v;render();break;
    case 'csave':saveCardio();break;
    /* --- progrès --- */
    case 'psport':SUB.psport=v;SUB.pexo='';SUB.pmes='';render();break;
    case 'pmes':SUB.pmes=v;render();break;
    case 'add-poids':{
      const n=+val('#poids-input');if(!n||n<20||n>400){toast('Pèse-toi entre 20 et 400 kg');break}
      D.profile.poids=n;D.weights.push({date:ymd(),kg:n});commit();toast('Pesée enregistrée');break;
    }
    /* --- exos --- */
    case 'check-ex':D.checked=D.checked||{};D.checked[id]=!D.checked[id];save();render();break;
    case 'measure':case 'measure-open':openMeasure(id);break;
    case 'msport':SUB.msport=v;openMeasure($('#ms-exo')?.value);break;
    case 'saveMeasure':saveMeasure();break;
    case 'exnew':openExoEditor(null);break;
    case 'exedit':openExoEditor(D.customExos.find(e=>e.id===id));break;
    case 'exdel':
      if(confirm2('Supprimer cet exercice personnalisé ?')){D.customExos=D.customExos.filter(e=>e.id!==id);commit()}break;
    case 'saveExo':saveExo();break;
    /* --- nutrition --- */
    case 'water':{
      if(D.nutrition.eauDate!==ymd()){D.nutrition.eau=0;D.nutrition.eauDate=ymd()}
      D.nutrition.eau=Math.max(0,(D.nutrition.eau||0)+ +v);commit();break;
    }
    case 'nutmode':D.nutrition.mode=v;save();render();break;
    case 'nutadd':{
      const l=val('#nut-label').trim(),c=+val('#nut-cal');
      if(!l||!c){toast('Indique un repas et des calories');break}
      D.nutrition.repas=D.nutrition.repas||[];D.nutrition.repas.push({id:uid(),date:ymd(),label:l,cal:c});commit();toast('Repas ajouté');break;
    }
    case 'nutdel':D.nutrition.repas=D.nutrition.repas.filter(r=>r.id!==id);commit();break;
    /* --- cycle --- */
    case 'cysave':saveCycle();break;
    case 'cym':{const n=+v,m=(SUB.cyMonth??new Date().getMonth())+n;
      if(m<0){SUB.cyMonth=11;SUB.cyYear=(SUB.cyYear||new Date().getFullYear())-1}
      else if(m>11){SUB.cyMonth=0;SUB.cyYear=(SUB.cyYear||new Date().getFullYear())+1}
      else SUB.cyMonth=m;render();break;
    }
    /* --- profil --- */
    case 'gotoprofil':navigate('profil');break;
    case 'setavatar':{
      const o=avatarOptions()[+a.dataset.i];
      if(o){D.profile.photo=o.src;commit();toast('Photo de profil changée')}
      break;
    }
    case 'photo-del':{
      const i=+a.dataset.i,src=D.profile.photos[i];
      if(!src)break;
      D.profile.photos.splice(i,1);
      if(D.profile.photo===src)D.profile.photo='';
      commit();toast('Photo supprimée de la galerie');break;
    }
    case 'photo-clear':
      if(confirm2('Effacer toutes tes photos enregistrées ?')){
        const had=D.profile.photos.includes(D.profile.photo);
        D.profile.photos=[];if(had)D.profile.photo='';
        commit();toast('Galerie vidée');
      }break;
    case 'photo-reset':D.profile.photo='';commit();toast('Silhouette restaurée');break;
    case 'photo-upload':$('#photo-file')?.click();break;
    case 'pfsave':{
      Object.assign(D.profile,{prenom:val('#pf-prenom').trim().slice(0,40),sexe:val('#pf-sexe')==='femme'?'femme':'homme',age:clamp(+val('#pf-age')||28,10,120),taille:clamp(+val('#pf-taille')||175,100,230),poids:clamp(+val('#pf-poids')||75,20,400),objectif:val('#pf-objectif').trim().slice(0,80)||'Progresser'});
      commit();toast('Profil enregistré');break;
    }
    case 'rythmesave':D.profile.rythme={muscu:clamp(+val('#pf-rm')||3,0,14),cardio:clamp(+val('#pf-rc')||2,0,14)};commit();toast('Rythme mis à jour');break;
    case 'export':doExport();break;
    case 'import':doImport();break;
    case 'wipe':
      if(confirm2('EFFACER TOUTES tes données ? Action irréversible.')){
        localStorage.removeItem('el-v1:'+CUR);D=blank();EDIT={};SUB={};commit();toast('Données effacées');
      }break;
    /* --- comptes / onboarding --- */
    case 'obdone':{
      if(!ACCTS.length){
        CUR=uid();ACCTS.push({id:CUR,nom:val('#ob-prenom').trim()||'Mon compte'});
        localStorage.setItem('sg-accounts',JSON.stringify(ACCTS));localStorage.setItem('sg-current',CUR);
        D=blank();
      }
      Object.assign(D.profile,{prenom:val('#ob-prenom').trim().slice(0,40),sexe:val('#ob-sexe')==='femme'?'femme':'homme',age:clamp(+val('#ob-age')||28,10,120),taille:clamp(+val('#ob-taille')||175,100,230),poids:clamp(+val('#ob-poids')||75,20,400),objectif:val('#ob-objectif').trim().slice(0,80)||'Progresser',rythme:{muscu:clamp(+val('#ob-rm')||3,0,14),cardio:clamp(+val('#ob-rc')||2,0,14)}});
      D.created=ymd();save();navigate('today');toast('Bienvenue dans Élan ⚡');break;
    }
    case 'demoacct':{
      if(D&&CUR&&CUR!=='demo')save(); // on ne perd pas le compte en cours
      const exists=ACCTS.some(a=>a.id==='demo');
      if(!exists){
        ACCTS.push({id:'demo',nom:'🎮 Démo (tout débloqué)'});
        safeSet('sg-accounts',ACCTS);
      }
      CUR='demo';try{localStorage.setItem('sg-current',CUR)}catch{}
      D=exists?sanitizeData(safeGet('el-v1:demo',null))||demoData():demoData();
      migrate();syncBadges();save();
      EDIT={};SUB={};closeSheet();navigate('today');
      toast(exists?'Compte démo rouvert':'Compte démo créé — tout est débloqué 🎮');break;
    }
    case 'newacct':openSheet('Nouveau compte',`<label class="f">Nom du compte</label><input class="f" id="na-nom" placeholder="Ex : Moi, Sport…">
      <button class="btn pri block" style="margin-top:12px" data-act="saveAcct">Créer</button>`);break;
    case 'saveAcct':{
      const n=val('#na-nom').trim();if(!n){toast('Donne un nom');break}
      const id=uid();ACCTS.push({id,nom:n});CUR=id;D=blank();
      localStorage.setItem('sg-accounts',JSON.stringify(ACCTS));localStorage.setItem('sg-current',id);
      save();closeSheet();navigate('today');toast('Compte créé');break;
    }
    case 'useacct':
      CUR=id;try{localStorage.setItem('sg-current',id)}catch{}
      D=sanitizeData(safeGet('el-v1:'+id,null));
      if(!D){D=blank();safeSet('el-v1:'+id,D)}
      migrate();syncBadges();safeSet('el-v1:'+id,D);
      EDIT={};SUB={};closeSheet();navigate(VIEW);break;
    case 'delacct':
      if(confirm2('Supprimer ce compte et ses données ?')){
        localStorage.removeItem('el-v1:'+id);ACCTS=ACCTS.filter(a=>a.id!==id);
        safeSet('sg-accounts',ACCTS);
        if(CUR===id){
          CUR=ACCTS[0]?.id||null;
          try{localStorage.setItem('sg-current',CUR||'')}catch{}
          if(CUR){D=sanitizeData(safeGet('el-v1:'+CUR,null))||blank();migrate();safeSet('el-v1:'+CUR,D)}
          else D=null;
        }
        closeSheet();
        if(!CUR){$('#app').innerHTML=onboarding();applyTheme()}
        else navigate(VIEW);
      }break;
  }
});
/* champs muscu synchronisés en direct */
document.addEventListener('input',e=>{
  const x=e.target.closest('[data-wex]');
  if(x&&EDIT.workout){EDIT.workout.exos[+x.dataset.wex][x.dataset.k]=x.value}
  if(e.target.id==='w-duree')EDIT.wDuree=e.target.value;
  if(e.target.id==='w-note')EDIT.wNote=e.target.value;
  if(e.target.id==='c-duree')EDIT.cDuree=e.target.value;
  if(e.target.id==='c-dist')EDIT.cDist=e.target.value;
  if(e.target.id==='c-note')EDIT.cNote=e.target.value;
  if(e.target.dataset?.act==='accent-custom'){D.settings.accent=e.target.value;applyTheme();save()}
  if(e.target.dataset?.act==='accent2-custom'){D.settings.accent2=e.target.value;applyTheme();save()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='photo-file'){
    const files=[...(e.target.files||[])];e.target.value='';
    if(!files.length)return;
    const process=f=>new Promise(res=>{
      if(f.size>8*1024*1024){toast('Image trop volumineuse (8 Mo max)');return res()}
      const img=new Image(),obj=URL.createObjectURL(f);
      img.onload=()=>{
        const s=256,c=document.createElement('canvas');c.width=s;c.height=s;
        const ctx=c.getContext('2d'),side=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,s,s);
        const data=c.toDataURL('image/jpeg',.82);
        URL.revokeObjectURL(obj);
        D.profile.photos=D.profile.photos||[];
        if(!D.profile.photos.includes(data)&&D.profile.photos.length<8){D.profile.photos.push(data);D.profile.photo=data}
        res();
      };
      img.onerror=()=>{URL.revokeObjectURL(obj);res()};
      img.src=obj;
    });
    (async()=>{for(const f of files)await process(f);save();render();toast('Galerie mise à jour 📷')})();
  }
  if(e.target.matches('[data-act="pexo"]')){SUB.pexo=e.target.value;SUB.pmes='';render()}
  if(e.target.matches('[data-act="import-file"]')){
    const f=e.target.files[0];if(!f)return;
    if(f.size>2*1024*1024){toast('Fichier trop volumineux (2 Mo max)');return}
    const r=new FileReader();
    r.onload=()=>{
      const o=safeParse(r.result,null),clean=sanitizeData(o);
      if(!clean){toast('Fichier invalide ou incompatible');return}
      D=clean;migrate();syncBadges();save();closeSheet();navigate(VIEW);toast('Import validé et importé ✓');
    };
    r.onerror=()=>toast('Lecture du fichier impossible');
    r.readAsText(f);
    e.target.value='';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ============ ACTIONS ============ */
function syncWorkout(){
  $$('[data-wex]').forEach(x=>{if(EDIT.workout)EDIT.workout.exos[+x.dataset.wex][x.dataset.k]=x.value});
  const n=$('#w-note');if(n)EDIT.wNote=n.value;
}
function openExoPicker(){
  openSheet('Ajouter un exercice',`
    <input class="f" id="ex-search" placeholder="Rechercher un exercice…" autocomplete="off">
    <div id="ex-results" style="margin-top:10px">${exoListHTML('')}</div>`);
  $('#ex-search').addEventListener('input',e=>{$('#ex-results').innerHTML=exoListHTML(e.target.value)});
}
function exoListHTML(q){
  const l=allExos().filter(e=>e.nom.toLowerCase().includes(q.toLowerCase()));
  return l.map(e=>`<button class="list-row" style="width:100%;text-align:left" data-act="pick-exo" data-id="${e.id}">
    <div class="ic mus">🏋️</div><div class="grow"><b>${esc(e.nom)}</b><div class="tiny muted">${esc(e.grp||'')}</div></div><div class="ac">＋</div>
  </button>`).join('')||'<div class="empty tiny">Aucun résultat.</div>';
}
function saveWorkout(){
  syncWorkout();
  const w=EDIT.workout,exos=w.exos.filter(e=>+e.kg||+e.reps||+e.series);
  if(!exos.length){toast('Renseigne au moins un exercice (kg, reps ou séries)');return}
  const items=[];
  exos.forEach(e=>{
    if(+e.kg)items.push({exo:e.nom,mesure:'kg',valeur:+e.kg});
    if(+e.reps)items.push({exo:e.nom,mesure:'répétitions',valeur:+e.reps});
    if(+e.series)items.push({exo:e.nom,mesure:'séries',valeur:+e.series});
  });
  const mids=[],rids=[];
  items.forEach(i=>{const meas=recordMeasure('muscu',i.exo,i.mesure,i.valeur);if(meas){mids.push(meas.id);i.id=meas.id}});
  const recs=detectRecords(items);
  recs.forEach(r=>{const rec={id:uid(),date:ymd(),...r};D.records.push(rec);rids.push(rec.id)});
  const prog=D.programs.find(p=>p.id===w.prog);
  D.activities.push({id:uid(),date:ymd(),type:'muscu',program:prog?.nom||(w.prog==='libre'?'Libre':''),exos,note:EDIT.wNote||'',avis:EDIT.wAvis||0,duree:clamp(+val('#w-duree')||+EDIT.wDuree||0,0,1440),mids,rids});
  D.streak.best=Math.max(D.streak.best,currentStreak());
  EDIT.workout=null;EDIT.wNote='';EDIT.wAvis=0;EDIT.wDuree='';
  burst(recs.length?'laurel':'spark');
  commit();
  toast(recs.length?`Séance enregistrée · ${recs.length} record${recs.length>1?'s':''} 🏆`:'Séance enregistrée 💪');
}
function saveCardio(){
  const m=EDIT.cmode||'course',cfg=CARDIO.find(c=>c.id===m);
  const duree=+val('#c-duree'),dist=+val('#c-dist');
  if(!duree||duree<=0){toast('Indique une durée en minutes');return}
  if(cfg.dist&&(!dist||dist<=0)){toast('Indique la distance en km');return}
  D.activities.push({id:uid(),date:ymd(),type:'cardio',mode:m,duree,distance:cfg.dist?dist:0,tours:cfg.dist?0:dist,note:val('#c-note'),avis:EDIT.cAvis||0});
  D.streak.best=Math.max(D.streak.best,currentStreak());
  EDIT.cDuree='';EDIT.cDist='';EDIT.cNote='';EDIT.cAvis=0;
  burst('volt');commit();toast('Séance cardio enregistrée 🏃');
}
function openProgramEditor(p){
  const all=allExos();
  openSheet(p?'Modifier '+p.nom:'Nouveau programme',`
    <label class="f">Nom</label><input class="f" id="pg-nom" value="${esc(p?.nom||'')}" placeholder="Ex : Push A">
    <label class="f">Icône</label><input class="f" id="pg-ic" value="${esc(p?.ic||'💪')}" maxlength="4">
    <label class="f">Exercices</label>
    <div style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:13px;padding:6px">
      ${all.map(e=>`<button class="list-row ptoggle ${p?.exos.includes(e.id)?'on':''}" data-act="ptoggle" data-id="${e.id}" style="width:100%;text-align:left;border-color:${p?.exos.includes(e.id)?'var(--ac)':'var(--line)'}">
        <div class="chk ${p?.exos.includes(e.id)?'on':''}">${p?.exos.includes(e.id)?'✓':''}</div><div class="grow small">${esc(e.nom)}</div></button>`).join('')}
    </div>
    <button class="btn pri block" style="margin-top:12px" data-act="psaveProg" data-id="${p?.id||''}">Enregistrer</button>`);
}
function saveProgram(){
  const nom=val('#pg-nom').trim();if(!nom){toast('Donne un nom au programme');return}
  const exos=$$('.ptoggle.on').map(x=>x.dataset.id);
  if(!exos.length){toast('Choisis au moins un exercice');return}
  const pid=document.querySelector('[data-act="psaveProg"]')?.dataset.id||'';
  const data={nom,ic:val('#pg-ic').trim()||'💪',exos};
  if(pid){const p=D.programs.find(x=>x.id===pid);if(p)Object.assign(p,data)}
  else D.programs.push({id:uid(),...data});
  if(EDIT.workout)EDIT.workout=null;
  closeSheet();commit();toast('Programme enregistré');
}
function openMeasure(exoid){
  const e=exoById(exoid),sport=SUB.msport==='cardio'?'cardio':'muscu';
  openSheet('Mesurer '+(e?e.nom:'un exercice'),`
    <label class="f">Sport</label><div class="seg">${['muscu','cardio'].map(s=>`<button class="${sport===s?'on':''}" data-act="msport" data-v="${s}">${s==='muscu'?'🏋️ Muscu':'🏃 Cardio'}</button>`).join('')}</div>
    ${e?`<input type="hidden" id="ms-exo" value="${esc(e.id)}">`:`<label class="f">Exercice</label><select class="f" id="ms-exo">${allExos().map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join('')}</select>`}
    <div class="grid2">
      <div><label class="f">Poids (kg)</label><input class="f" id="ms-kg" type="number" inputmode="decimal" placeholder="—"></div>
      <div><label class="f">Répétitions</label><input class="f" id="ms-reps" type="number" inputmode="numeric" placeholder="—"></div>
      <div><label class="f">Séries</label><input class="f" id="ms-series" type="number" inputmode="numeric" placeholder="—"></div>
      <div><label class="f">Temps (mm:ss)</label><input class="f" id="ms-temps" placeholder="2:30"></div>
      <div><label class="f">Distance (km)</label><input class="f" id="ms-dist" type="number" inputmode="decimal" placeholder="—"></div>
      <div><label class="f">Vitesse (km/h)</label><input class="f" id="ms-vit" type="number" inputmode="decimal" placeholder="auto"></div>
    </div>
    <label class="f">Note</label><input class="f" id="ms-note" placeholder="Optionnel">
    <button class="btn pri block" style="margin-top:14px" data-act="saveMeasure">Enregistrer la mesure</button>
    <div class="tiny muted" style="margin-top:8px">Chaque mesure compte comme une séance pour ta streak.</div>`);
}
function parseTemps(s){if(!s)return 0;const p=s.split(':').map(Number);return p.length===2?(p[0]*60+p[1]):(p[0]||0)}
function saveMeasure(){
  const id=$('#ms-exo').value,e=exoById(id),nom=e?.nom||'Exercice';
  const vals={kg:+val('#ms-kg'),reps:+val('#ms-reps'),series:+val('#ms-series'),temps:parseTemps(val('#ms-temps')),distance:+val('#ms-dist'),vitesse:+val('#ms-vit')};
  const LABEL={kg:'kg',reps:'répétitions',series:'séries',temps:'temps',distance:'distance',vitesse:'vitesse'};
  const items=[];
  for(const k in vals)if(vals[k]>0)items.push({exo:nom,mesure:LABEL[k],valeur:vals[k]});
  if(!items.length){toast('Renseigne au moins une mesure');return}
  const sport=SUB.msport==='cardio'?'cardio':'muscu';
  const mids=[],rids=[];
  items.forEach(i=>{const meas=recordMeasure(sport,i.exo,i.mesure,i.valeur);if(meas){mids.push(meas.id);i.id=meas.id}});
  const recs=detectRecords(items);
  recs.forEach(r=>{const rec={id:uid(),date:ymd(),...r};D.records.push(rec);rids.push(rec.id)});
  D.activities.push({id:uid(),date:ymd(),type:sport,program:'Mesure',exos:[{id,nom,note:val('#ms-note')}],note:val('#ms-note'),avis:0,duree:clamp(vals.temps||0,0,1440),mids,rids});
  D.streak.best=Math.max(D.streak.best,currentStreak());
  burst(recs.length?'laurel':'spark');
  closeSheet();commit();toast(recs.length?'Mesure enregistrée · record 🏆':'Mesure enregistrée 📊');
}
function openExoEditor(e){
  openSheet(e?'Modifier l’exercice':'Nouvel exercice',`
    <label class="f">Nom</label><input class="f" id="xe-nom" value="${esc(e?.nom||'')}" placeholder="Ex : Rowing cable">
    <label class="f">Groupe musculaire</label><input class="f" id="xe-grp" value="${esc(e?.grp||'')}" placeholder="Ex : Dos">
    <label class="f">Catégorie</label><select class="f" id="xe-cat">
      ${[['exos','Exercices'],['warm','Échauffement'],['stretch','Étirements']].map(([k,l])=>`<option value="${k}" ${e?.cat===k?'selected':''}>${l}</option>`).join('')}
    </select>
    <button class="btn pri block" style="margin-top:12px" data-act="saveExo" data-id="${e?.id||''}">Enregistrer</button>`);
}
function saveExo(){
  const nom=val('#xe-nom').trim();if(!nom){toast('Donne un nom');return}
  const data={nom,grp:val('#xe-grp').trim(),cat:val('#xe-cat')};
  const id=a_act();function a_act(){return document.querySelector('[data-act="saveExo"]')?.dataset.id||''}
  if(id){const e=D.customExos.find(x=>x.id===id);if(e)Object.assign(e,data)}
  else D.customExos.push({id:uid(),...data,custom:true});
  closeSheet();commit();toast('Exercice enregistré');
}
function saveCycle(){
  const debut=val('#cy-debut'),longueur=+val('#cy-long')||28;
  if(!debut){toast('Choisis une date');return}
  D.cycle={debut,longueur,regles:clamp(+val('#cy-reg')||5,1,15)};
  commit();toast('Cycle mis à jour');
}
function doExport(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download='elan-'+ymd()+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
  toast('Export téléchargé');
}
function doImport(){
  openSheet('Importer des données',`<p class="small muted">Choisis un fichier JSON exporté depuis Élan.</p>
    <input class="f" type="file" accept="application/json,.json" data-act="import-file" style="margin-top:12px;padding:8px">
    <button class="btn gh block" style="margin-top:10px" data-act="close">Annuler</button>`);
}
/* ============ DÉMARRAGE ============ */
initState();
if(!ACCTS.length||!D){
  applyTheme();
  $('#app').innerHTML=onboarding();
}else{
  render();
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker indisponible',e));

</script>
