<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'">
<meta name="description" content="Élan — ton carnet sportif multi-sport, 100 % privé. Muscu, course, vélo, natation, padel… tout suit dans une seule app, hors ligne, sans compte en ligne.">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Élan – ton carnet sportif</title>
<style>
/* ===== Tokens — sombre par défaut, clair en miroir ===== */
:root{
  --bg:#0a0a0c;--card:#16161a;--card2:#1d1d23;--line:rgba(255,255,255,.08);
  --ink:#f2f4f0;--mute:#9aa3ab;
  --acc:#ccff00;--acc-ink:#0a0a0c;--acc-text:#ccff00;--acc-soft:rgba(204,255,0,.10);
  --good:#4ade80;--warn:#facc15;--danger:#f87171;
  --prot:#60a5fa;--gluc:#facc15;--lip:#f472b6;
  --r1:#ccff00;--r2:#22d3ee;--r3:#fb923c;
  --cyc:#f87171;--cyc-soft:rgba(248,113,113,.15);
  --soft:rgba(255,255,255,.05);--softer:rgba(255,255,255,.09);
  --bar:rgba(14,14,17,.92);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f4f6f1;--card:#ffffff;--card2:#eef1e9;--line:rgba(15,20,8,.10);
  --ink:#141810;--mute:#6b7280;
  --acc:#ccff00;--acc-ink:#141810;--acc-text:#5e8f00;--acc-soft:rgba(150,200,0,.14);
  --good:#16a34a;--warn:#a16207;--danger:#dc2626;
  --prot:#2563eb;--gluc:#a16207;--lip:#db2777;
  --r1:#84b800;--r2:#0891b2;--r3:#ea580c;
  --cyc:#dc2626;--cyc-soft:rgba(220,38,38,.10);
  --soft:rgba(15,20,8,.045);--softer:rgba(15,20,8,.09);
  --bar:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(15,20,8,.06),0 10px 30px rgba(15,20,8,.08);
}}
:root[data-theme="light"]{
  --bg:#f4f6f1;--card:#ffffff;--card2:#eef1e9;--line:rgba(15,20,8,.10);
  --ink:#141810;--mute:#6b7280;
  --acc:#ccff00;--acc-ink:#141810;--acc-text:#5e8f00;--acc-soft:rgba(150,200,0,.14);
  --good:#16a34a;--warn:#a16207;--danger:#dc2626;
  --prot:#2563eb;--gluc:#a16207;--lip:#db2777;
  --r1:#84b800;--r2:#0891b2;--r3:#ea580c;
  --cyc:#dc2626;--cyc-soft:rgba(220,38,38,.10);
  --soft:rgba(15,20,8,.045);--softer:rgba(15,20,8,.09);
  --bar:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(15,20,8,.06),0 10px 30px rgba(15,20,8,.08);
}
/* ===== Base ===== */
*{box-sizing:border-box}
html{scroll-padding-top:8px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:14px 14px 0}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:10px 0 2px}
h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:0 0 10px}
h3{font-size:16px;font-weight:700;margin:0 0 6px}
p{margin:0 0 8px}
.hint{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:22px 10px;border:1.5px dashed var(--line);border-radius:14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.num{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-size:15px;font-weight:700;color:var(--mute);letter-spacing:0}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.grow{flex:1;min-width:0}
/* ===== Boutons / chips ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:14px;border:0;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;transition:transform .12s var(--ease),filter .12s}
.btn:active{transform:scale(.97);filter:brightness(1.05)}
.btn.alt{background:var(--card2);color:var(--ink);border:1.5px solid var(--line);font-weight:700}
.btn.dgr{background:var(--danger-soft,rgba(248,113,113,.14));color:var(--danger)}
.btn.big{width:100%;font-size:16px;min-height:56px;border-radius:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:9px 14px;border-radius:13px;background:var(--card2);border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;transition:border-color .12s,background .12s}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--ink)}
.chip:active{transform:scale(.97)}
.sc{width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:18px;cursor:pointer}
/* ===== Formulaires ===== */
label.lbl{display:block;font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);min-height:48px;padding:8px 12px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:22px;min-height:22px;height:22px;accent-color:var(--acc)}
/* ===== Tabbar ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;min-height:58px;border:0;background:none;color:var(--mute);font-family:inherit;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:4px 0}
.tabbar button i{font-style:normal;font-size:21px;line-height:1;transition:transform .15s var(--ease)}
.tabbar button.on{color:var(--acc-text)}
.tabbar button.on i{transform:scale(1.18)}
/* ===== Anneaux ===== */
.rings{display:flex;align-items:center;gap:14px}
.rings svg{flex:none}
.rleg{display:grid;gap:6px;font-size:13px}
.rleg b{font-variant-numeric:tabular-nums}
.rdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
/* ===== Heatmap ===== */
.heat{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--soft)}
.heat .l1{background:var(--acc);opacity:.25}
.heat .l2{background:var(--acc);opacity:.5}
.heat .l3{background:var(--acc);opacity:.75}
.heat .l4{background:var(--acc)}
/* ===== Streak dots ===== */
.wd{display:flex;gap:6px}
.wd span{flex:1;text-align:center;font-size:10px;color:var(--mute);font-weight:700}
.wd i{display:block;width:14px;height:14px;border-radius:50%;background:var(--soft);margin:4px auto 3px}
.wd .on i{background:var(--acc)}
/* ===== Badges ===== */
.bdg{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.bdg em{font-style:normal;font-size:26px}
.bdg.off{opacity:.38;filter:grayscale(1)}
/* ===== Liste activités ===== */
.act{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--soft)}
.act:first-of-type{border-top:0}
.sico{width:44px;height:44px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--soft);border:1px solid var(--line)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;margin:16px 0 4px;color:var(--ink)}
.dayh:first-child{margin-top:0}
.dayh small{color:var(--mute);font-weight:600}
.del{border:0;background:none;color:var(--mute);font-size:18px;min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}
.del:active{color:var(--danger)}
/* ===== Barres ===== */
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width .5s var(--ease)}
.bar.blue i{background:var(--prot)}
.bar.warn i{background:var(--warn)}
/* ===== KPI grid ===== */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi .card{margin:0;padding:12px;text-align:center}
/* ===== Sheet ===== */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheetin{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .28s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shgr{width:44px;height:5px;border-radius:3px;background:var(--softer);margin:0 auto 14px}
/* ===== Toast / célébration ===== */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);z-index:60;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.big{background:var(--acc);color:var(--acc-ink);font-size:15px;border-color:transparent;animation:pop .55s var(--ease)}
@keyframes pop{0%{transform:translateX(-50%) scale(.7);opacity:0}60%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(1)}}
/* ===== Overlays (auth / onboarding) ===== */
.gate{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;padding:24px 18px calc(40px + env(safe-area-inset-bottom,0px))}
.gatein{max-width:420px;margin:0 auto;padding-top:6vh}
.gate h1{font-size:32px}
.gate .logo{font-size:44px;letter-spacing:-.02em;color:var(--acc-text);font-weight:800}
.steps{display:flex;gap:6px;margin:14px 0 18px}
.steps i{height:5px;flex:1;border-radius:3px;background:var(--soft)}
.steps i.on{background:var(--acc)}
/* ===== Divers ===== */
.tabbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabbtns button{min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font-weight:700;font-family:inherit;font-size:13px;cursor:pointer}
.tabbtns button.on{border-color:var(--acc);background:var(--acc-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- ===== Accueil onboarding / auth ===== -->
<div class="gate" id="auth" hidden>
  <div class="gatein">
    <div class="logo">Élan<span style="color:var(--acc)">.</span></div>
    <h1 id="authT">Ton carnet sportif</h1>
    <p class="hint">100 % privé : tout reste sur cet appareil. Aucun compte en ligne, aucun réseau.</p>
    <div id="authC"></div>
  </div>
</div>
<div class="gate" id="onb" hidden>
  <div class="gatein">
    <div class="logo">Élan<span style="color:var(--acc)">.</span></div>
    <h1>Ton bilan d'équipement</h1>
    <div class="steps" id="onbSteps"><i class="on"></i><i></i><i></i><i></i></div>
    <div id="onbC"></div>
  </div>
</div>
<!-- ===== App ===== -->
<main id="app" hidden>
  <section id="sctoday"></section>
  <section id="scjournal" hidden></section>
  <section id="scprogres" hidden></section>
  <section id="scnut" hidden></section>
  <section id="sccycle" hidden></section>
  <section id="scexos" hidden></section>
<section id="scprofil" hidden></section>
</main>
<nav class="tabbar" id="tabbar" hidden aria-label="Navigation principale">
  <button data-t="today" aria-current="page"><i>⚡</i>Aujourd'hui</button>
  <button data-t="journal"><i>📒</i>Journal</button>
  <button data-t="progres"><i>📈</i>Progrès</button>
  <button data-t="nut"><i>🍽️</i>Nutrition</button>
  <button data-t="exos"><i>🏋️</i>Exos</button>
  <button data-t="cycle"><i>🌙</i>Cycle</button>
  <button data-t="profil"><i>👤</i>Profil</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="sheetin" id="sheetin"><div class="shgr" aria-hidden="true"></div><div id="sheetc"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ===== Helpers ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYMS=864e5,uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>new Date().toISOString().slice(0,10);
const dn=d=>Math.floor(Date.parse(d+"T00:00:00Z")/DAYMS);
const fd=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const fds=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
const fn=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:1}).format(n);
const hh=m=>m>=60?Math.floor(m/60)+" h"+(m%60?" "+(m%60):""):Math.round(m)+" min";
const J=(k,x)=>{try{return x?JSON.parse(localStorage.getItem(k)):JSON.stringify(x)}catch(e){return x?null:void 0}};
let S=null,NAME=null;

/* ===== Sports ===== */
const SPORTS=[
 {id:"muscu",n:"Musculation",e:"🏋️",met:5,kind:"series"},
 {id:"course",n:"Course",e:"🏃",met:9,kind:"dist"},
 {id:"velo",n:"Vélo",e:"🚴",met:7,kind:"dist"},
 {id:"natio",n:"Natation",e:"🏊",met:8,kind:"dist"},
 {id:"padel",n:"Padel / Tennis",e:"🎾",met:6,kind:"dur"},
 {id:"volley",n:"Volley",e:"🏐",met:6,kind:"dur"},
 {id:"escal",n:"Escalade",e:"🧗",met:8,kind:"dur"},
 {id:"rando",n:"Randonnée",e:"🥾",met:6,kind:"dist"},
 {id:"foot",n:"Football / Basket",e:"⚽",met:7,kind:"dur"},
 {id:"hiit",n:"HIIT / Cardio",e:"🤸",met:9,kind:"dur"},
 {id:"street",n:"Street workout",e:"🤸",met:6,kind:"series"},
 {id:"maison",n:"Juste à la maison",e:"🏠",met:5,kind:"dur"},
 {id:"autre",n:"Autre",e:"✨",met:6,kind:"dur"}
];
function allSports(){return SPORTS.concat(S.sports||[])}
function sportOf(id){return allSports().find(s=>s.id===id)||SPORTS[9]}
function metSummary(a){const sp=sportOf(a.s);
  if(a.s==="muscu"){const n=(S.sets||[]).filter(x=>x.id&&x.d===a.d&&x.a===a.id).length||a.met.n;return n+" série"+(n>1?"s":"")}
  let t=[];if(a.met.min)t.push(hh(a.met.min));if(a.met.km)t.push(fn(a.met.km)+" km");
  if(a.met.ex&&a.met.ex.length)t.push(a.met.ex.length+" exo"+(a.met.ex.length>1?"s":""));
  if(a.rv)t.push("⭐".repeat(a.rv));
  if(a.met.note)t.push(a.met.note.slice(0,40));
  return t.join(" · ")||"—"}
function kcalOf(a){const w=(S.profile.w||70),sp=sportOf(a.s);
  if(a.s==="muscu"){const n=(S.sets||[]).filter(x=>x.d===a.d&&x.a===a.id).length;return Math.round(n*10*w/70)}
  const min=a.met.min||((a.met.km||0)*(sp.id==="velo"?4:10));return Math.round((sp.met||6)*w/60*(min||30))}

/* ===== État ===== */
function fresh(){return{profile:{},goals:{ses:3,min:180,kcal:2000,prot:100,eau:8},sports:[],acts:[],sets:[],flog:{},eau:{},cycle:null,badges:[],seen:[]}}
function save(){localStorage.setItem("el-v1:"+NAME,JSON.stringify(S))}
function loadS(){S=Object.assign(fresh(),J("el-v1:"+NAME,true)||{});S.goals=Object.assign({ses:3,min:180,kcal:2000,prot:100,eau:8},S.goals);
  /* Sanitation : sports = objets uniquement (protection des vieilles données) */
  S.sports=(S.sports||[]).filter(x=>x&&typeof x==="object"&&x.id);
  S.fav=(S.fav||[]).filter(x=>typeof x==="string"&&sportOf(x));
  S.acts=(S.acts||[]).filter(a=>a&&a.id&&sportOf(a.s));
  S.dishes=S.dishes||{};S.lvl=S.lvl||{};S.mood=S.mood||{};S.chal=S.chal||{};S.spchal=S.spchal||{};S.wlog=S.wlog||[];S.bx=S.bx||[];}
/* Migration depuis l'ancienne app "Suivi salle" */
function migrate(){const O=J("suivi-salle-v1:"+NAME,true);if(!O)return;
  try{
    if(O.profile)S.profile=Object.assign(S.profile,O.profile);
    (O.sessions||[]).forEach(x=>S.sets.push({id:uid(),a:null,d:x.d,m:x.m,w:x.w||0,r:x.r||0,t:x.t||0}));
    const by={};S.sets.forEach(x=>{(by[x.d]=by[x.d]||[]).push(x)});
    Object.keys(by).forEach(d=>{const a={id:uid(),d,s:"muscu",met:{n:by[d].length},t:Date.now()};S.acts.push(a);by[d].forEach(x=>x.a=a.id)});
    if(O.flog)Object.keys(O.flog).forEach(d=>S.flog[d]=O.flog[d]);
    if(O.cycle)S.cycle=O.cycle;
    if(O.nut&&O.nut.k)S.goals.kcal=Math.round(O.nut.k);
    if(O.nutP)S.goals.prot=O.nutP;
    if(O.daily&&O.daily.shown)S.seen=O.daily.shown;
    if(!S.profile.goal)S.profile.goal="forme";
  S.goals.per=S.goals.per||{};
  if(!Object.keys(S.goals.per).length){const favs=(S.fav&&S.fav.length)?S.fav:["muscu","course"];const t=S.goals.ses||3;
    favs.forEach((id,i)=>{S.goals.per[id]=i===0?Math.max(1,t-favs.length+1):1})};
  S.goals.ses=Object.values(S.goals.per).reduce((a,b)=>a+b,0)||S.goals.ses||3;
  S.lvl=S.lvl||{};
  save();localStorage.removeItem("suivi-salle-v1:"+NAME);
  }catch(e){}}

/* ===== Streak & badges ===== */
function activeDays(){return new Set(S.acts.map(a=>a.d))}
function streak(){const A=activeDays();let d=today();if(!A.has(d)){d=new Date(Date.parse(today()+"T00:00:00Z")-DAYMS).toISOString().slice(0,10);if(!A.has(d))return 0}
  let n=0;while(A.has(d)){n++;d=new Date(Date.parse(d+"T00:00:00Z")-DAYMS).toISOString().slice(0,10)}return n}
const BADGES=[
 {id:"first",e:"🥇",n:"Première séance",d:"Ta toute première activité enregistrée",c:()=>S.acts.length>=1},
 {id:"a10",e:"🎖️",n:"10 activités",d:"La régularité s'installe",c:()=>S.acts.length>=10},
 {id:"a25",e:"🏅",n:"25 activités",d:"Tu es lancé",c:()=>S.acts.length>=25},
 {id:"a50",e:"🏆",n:"50 activités",d:"Une vraie habitude",c:()=>S.acts.length>=50},
 {id:"a100",e:"💯",n:"100 activités",d:"Légende du carnet",c:()=>S.acts.length>=100},
 {id:"s3",e:"🔥",n:"3 jours d'affilée",d:"Premier mini-streak",c:()=>streak()>=3},
 {id:"s7",e:"⚡",n:"7 jours d'affilée",d:"Une semaine complète",c:()=>streak()>=7},

function applyAccent(val){
  const r=document.documentElement.style;
  if(ACCENTS[val]){const a=ACCENTS[val];r.setProperty("--acc",a.acc);r.setProperty("--acc-ink",a.ink);r.setProperty("--acc-text",a.text);r.setProperty("--acc-soft",a.soft)}
  else if(/^#[0-9a-f]{6}$/i.test(val)){r.setProperty("--acc",val);r.setProperty("--acc-ink","#ffffff");r.setProperty("--acc-text",val);r.setProperty("--acc-soft",val+"24")}
  if(!S) return;

}
function _hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255]}
function _rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function adjustHex(hex,amt){const [r,g,b]=_hexToRgb(hex);return _rgbToHex(r+amt,g+amt,b+amt)}
function applyPrimary(val){
  const r=document.documentElement.style;const mode=document.documentElement.dataset.theme||'dark';
  if(!val){r.removeProperty('--bg');r.removeProperty('--card');r.removeProperty('--card2');r.removeProperty('--line');r.removeProperty('--bar');r.removeProperty('--ink');if(S){S.profile.primary=null;save()}return}
  r.setProperty('--bg',val);
  const cardAmt=mode==='dark'?12:-12;
  r.setProperty('--card',adjustHex(val,cardAmt));
  r.setProperty('--card2',adjustHex(val,cardAmt*2));
  r.setProperty('--line',adjustHex(val,cardAmt*3));
  r.setProperty('--bar',adjustHex(val,cardAmt));
  // contrast ink
  const [rr,gg,bb]=_hexToRgb(val);const lum=(0.299*rr+0.587*gg+0.114*bb)/255;
  r.setProperty('--ink',lum>0.5?'#141810':'#f4f6f1');
  if(S){S.profile.primary=val;save()}
}

function commonSportBadges(id,sp){
  const defs=[];

  // Séances milestones
  [1,3,5,10,15,20,25,30,50,75,100].forEach(m=>defs.push({id:"sb-"+id+"-s"+m,e:sp.e,n:m+" seances de "+sp.n,d:"Enregistrer "+m+" seances de "+sp.n,cond:()=>cnt()>=m}));

function isSportFinalized(id){const defs=sportBadgeDefs(id);return defs.length>0&&defs.every(b=>(S.badges||[]).includes(b.id))}
function checkPantheon(){S.pantheon=S.pantheon||[];let changed=false;
  (S.fav||[]).forEach(id=>{
    if(!id||id==="autre")return;
    if(isSportFinalized(id)&&!S.pantheon.includes(id)){S.pantheon.push(id);changed=true;
      const deity=DEITIES[Math.min(S.pantheon.length-1,DEITIES.length-1)];
      S.badges=S.badges||[];if(!S.badges.includes("pantheon-"+deity.id)){S.badges.push("pantheon-"+deity.id);celebrate(deity.e+" Pantheon debloque : "+deity.n+" — "+deity.title)}
    }
  });
  const favs=(S.fav||[]).filter(x=>x!=="autre");
  if(favs.length>0&&favs.every(isSportFinalized)&&!S.pantheonComplete){
    S.pantheonComplete=true;changed=true;
    S.badges=S.badges||[];if(!S.badges.includes("pantheon-complete")){
      S.badges.push("pantheon-complete");
      S.profile.accent="gold";try{applyAccent("gold")}catch(e){}
      celebrate("⚡🏛️ PANTHÉON COMPLET — Tu es devenu DIEU DU SPORT ! Thème OR débloqué à jamais.")
    }
  }

function cyclePhase(d){const C=S.cycle;if(!C||!(C.starts||[]).length)return null;
  const starts=[...C.starts].sort(),last=starts.filter(x=>x<=d).pop();if(!last)return null;
  const raw=dn(d)-dn(last)+1,cl=C.cl||28,pl=C.pl||5,ov=Math.round(cl/2);
  const day=raw>cl?((raw-1)%cl)+1:raw;
  return{day,cl,pl,last,ph:day<=pl?"regles":day<=ov-3?"folli":day<=ov+2?"ovu":"luteal"}}

/* ===== Mini graphique SVG (poids, charges) ===== */
function svgLine(pts,H,LBL){H=H||70;LBL=LBL||"pesées";if(pts.length<2)return `<p class="empty">Deux ${LBL} minimum pour la courbe.</p>`;
  const W=300,p=20,ys=pts.map(q=>q.y),mn=Math.min(...ys),mx=Math.max(...ys),r=(mx-mn)||1;
  const X=i=>p+(W-2*p)*i/(pts.length-1),Y=v=>H-p-(H-2*p)*(v-mn)/r;
  const path=pts.map((q,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(q.y).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution"><path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round"/>${pts.map((q,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="3" fill="var(--acc)"/>`).join("")}</svg>`}

let progBadgeSport=null;

function renderProgres(){const da=activeDays();
  /* heatmap 16 semaines */
  const m=monday(),minD={};S.acts.forEach(a=>minD[a.d]=(minD[a.d]||0)+minOf(a));
  let cells="";for(let w=15;w>=0;w--)for(let i=0;i<7;i++){const d=ziso(dn(m)-7*w+i);const mn=minD[d]||0;const lv=mn===0?0:mn<30?1:mn<60?2:mn<90?3:4;
    cells+=`<i class="${lv?"l"+lv:""}" title="${fd(d)} : ${mn} min"></i>`}
  /* minutes par semaine (8 dernières) */
  const weeks=[];for(let w=7;w>=0;w--){let t=0;S.acts.forEach(a=>{const dd=dn(a.d);if(dd<=dn(m)-7*w&&dd>dn(m)-7*w-7)t+=minOf(a)});weeks.push(t)}
  const mx=Math.max(...weeks,60);
  const bars=weeks.map((v,i)=>`<div style="flex:1;text-align:center"><div title="${v} min" style="height:${Math.max(4,Math.round(v/mx*96))}px;background:var(--acc);border-radius:6px;opacity:${v?1:.15};margin:0 auto"></div><small class="hint">${v>=60?Math.round(v/60)+"h":v}</small></div>`).join("");
  /* records muscu */
  const rec={};S.sets.forEach(x=>{if(x.w>(rec[x.m]||{w:0}).w)rec[x.m]={w:x.w,d:x.d}});
  const recList=Object.keys(rec).sort().map(mm=>`<li style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--soft)"><span><b>${esc(mm)}</b><small class="hint" style="display:block">record du ${fd(rec[mm].d)}</small></span><b>${fn(rec[mm].w)} kg</b></li>`).join("");
  /* par sport ce mois */
  const d30=ziso(dn(today())-30),byS={};S.acts.filter(a=>a.d>=d30).forEach(a=>byS[a.s]=(byS[a.s]||0)+minOf(a));
  const sportRows=Object.keys(byS).sort((a,b)=>byS[b]-byS[a]).map(id=>{const s=sportOf(id);return `<div style="margin:8px 0"><div class="row"><span>${s.e} <b>${esc(s.n)}</b></span><small class="hint">${hh(byS[id])}</small></div><div class="bar"><i style="width:${Math.min(100,Math.round(byS[id]/Math.max(...Object.values(byS))*100))}%"></i></div></div>`}).join("");

    ${S.wlog.length?`<p class="hint" style="margin-bottom:6px">Dernière pesée : <b>${fn(S.wlog[S.wlog.length-1].kg)} kg</b> le ${fd(S.wlog[S.wlog.length-1].d)}</p>${svgLine(S.wlog.map(x=>({y:x.kg})))}`:`<p class="empty">Pesée-toi pour suivre ton évolution.</p>`}
    <div class="row" style="gap:6px;margin-top:8px"><div class="grow"><input id="wIn" type="number" min="30" max="250" step="0.1" inputmode="decimal" placeholder="Poids du jour (kg)" aria-label="Poids du jour en kg"></div><button class="btn" id="wOk" style="min-height:48px;padding:8px 16px">Peser</button></div></div>

function addNut(label,qty,kcal,prot,gl,lip){(S.flog[nutD]=S.flog[nutD]||[]).push({k:label,q:qty,kcal,prot,gl,lip});
  save();renderNut();toast("Ajouté : "+label)}
function renderNut(){const T=(S.flog[nutD]||[]).reduce((a,x)=>({k:a.k+x.kcal,p:a.p+x.prot,c:a.c+x.gl,l:a.l+x.lip}),{k:0,p:0,c:0,l:0});
  const g=S.goals,eau=S.eau[nutD]||0,dishes=Object.keys(S.dishes||{});
  const bar=(v,mx,cls)=>`<div class="bar ${cls||""}" role="progressbar" aria-valuenow="${Math.min(100,Math.round(v/mx*100))}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,Math.round(v/mx*100))}%"></i></div>`;
  const tab=(id,t)=>`<button type="button" class="${nutTab===id?"on":""}" data-nt="${id}">${t}</button>`;
  let addCard="";
  if(nutTab==="assi")addCard=`<div class="card">
    <h2>🥘 Assiettes-types</h2>
    <p class="hint">Un repas complet évalué d'avance — 1 tap pour l'ajouter.</p>
    <div class="chips" style="margin-top:8px">${Object.keys(ASSIETTES).map(k=>`<button type="button" class="chip" data-asi="${esc(k)}">${esc(k)}<small class="hint" style="margin-left:4px">${ASSIETTES[k].k[0]} kcal</small></button>`).join("")}</div>
    <button class="btn alt big" id="asiNew" style="margin-top:10px">＋ Créer une assiette</button></div>`;
  else if(nutTab==="plats")addCard=`<div class="card">
    <h2>🍽️ Mes plats</h2>
    <p class="hint">Crée ton plat une fois : kcal + protéines <b>pour 100 g</b> et le poids d'une assiette. Ensuite, ajoute en grammes ou en assiettes.</p>
    ${dishes.length?dishes.map(k=>{const D=S.dishes[k];
      return `<div style="padding:10px 0;border-top:1px solid var(--soft)">
        <div class="row"><div class="grow"><b>${esc(k)}</b><small class="hint" style="display:block">${D.k[0]} kcal · ${D.k[1]} g prot / 100 g${D.p?" · assiette "+fn(D.p)+" g":""}</small></div><button class="del" data-dishdel="${esc(k)}" aria-label="Supprimer le plat">🗑️</button></div>
        <div class="row" style="gap:6px;margin-top:4px">
          <div class="grow"><input type="number" min="1" inputmode="numeric" placeholder="Grammes (ex. 250)" data-dishg="${esc(k)}" aria-label="Grammes de ${esc(k)}"></div>
          <button type="button" class="btn" data-dishadd="${esc(k)}" style="min-height:44px;padding:8px 14px">＋ Pesé</button>
          ${D.p?`<button type="button" class="btn alt" data-dishas="${esc(k)}" style="min-height:44px;padding:8px 14px">🥘 1 assiette</button>`:""}
        </div></div>`}).join(""):`<p class="empty">Aucun plat enregistré.<br>Crée ton premier plat ci-dessous.</p>`}
    <button class="btn alt big" id="dishNew" style="margin-top:10px">＋ Créer un plat</button></div>`;
  else addCard=`<div class="card">
    <h2>⌨️ Saisie directe</h2>
    <p class="hint">Tu connais tes apports (app, étiquette…) ? Tape-les directement.</p>
    <div class="kpi" style="margin-top:6px">
      <div><label class="lbl">kcal</label><input id="drK" type="number" min="0" inputmode="numeric" placeholder="600"></div>
      <div><label class="lbl">Prot g</label><input id="drP" type="number" min="0" inputmode="numeric" placeholder="40"></div>
      <div><label class="lbl">Gluc g</label><input id="drC" type="number" min="0" inputmode="numeric" placeholder="60"></div>
    </div>
    <div class="row" style="gap:6px;margin-top:8px">
      <div class="grow"><label class="lbl">Lipides g</label><input id="drL" type="number" min="0" inputmode="numeric" placeholder="20"></div>
      <div class="grow"><label class="lbl">Nom (optionnel)</label><input id="drN" maxlength="30" placeholder="Repas du midi"></div>
    </div>
    <button class="btn big" id="drOk" style="margin-top:10px">Ajouter aux apports du jour</button></div>`;
  $("scnut").innerHTML=`
  <h1>Nutrition</h1><p class="hint">Trois façons d'entrer tes apports — choisis la plus rapide pour toi.</p>
  <input type="date" id="nfD" value="${nutD}" style="margin-bottom:12px" aria-label="Jour du journal">
  <div class="card">
    <h2>${nutD===today()?"Aujourd'hui":fd(nutD)}</h2>
    <div class="kpi">
      <div class="card"><div class="num" style="font-size:24px">${Math.round(T.k)}</div><p class="hint" style="margin:0">/ ${g.kcal} kcal</p></div>
      <div class="card"><div class="num" style="font-size:24px">${Math.round(T.p)}</div><p class="hint" style="margin:0">/ ${g.prot} g prot</p></div>
      <div class="card"><div class="num" style="font-size:24px">${T.k?Math.round(T.p*4/T.k*100):0}%</div><p class="hint" style="margin:0">prot / kcal</p></div>
    </div>
    <p class="hint" style="margin:10px 0 2px">Glucides ${Math.round(T.c)} g · Lipides ${Math.round(T.l)} g</p>
  </div>
  <div class="card">
    <h2>🧮 Calculateur de besoins</h2>
    <p class="hint">Estime tes besoins caloriques à partir de ton profil (Mifflin-St Jeor) et applique-les.</p>
    <div class="kpi" style="margin-top:6px">
      <div><label class="lbl">Activité</label><select id="calcAct">
        <option value="1.2">Sédentaire</option>
        <option value="1.375">Léger (1-2x/sem)</option>
        <option value="1.55" selected>Modéré (3-4x/sem)</option>
        <option value="1.725">Intense (5-6x/sem)</option>
        <option value="1.9">Très intense</option>
      </select></div>
    </div>
    <p class="hint" style="margin-top:8px" id="calcRes">—</p>
    <button class="btn" id="calcApply" style="margin-top:10px">Appliquer à mes objectifs</button>
  </div>
  <div class="card">
    <div class="row"><h2>💧 Eau</h2><b>${eau} / ${g.eau} verres</b></div>
    ${bar(eau,g.eau,"blue")}
    <div class="row" style="margin-top:8px"><button class="btn" id="eauPlus" style="flex:1">＋ 1 verre (250 ml)</button><button class="btn alt" id="eauMoins" style="flex:1">− 1</button></div>
  </div>
  <div class="tabbtns">${tab("assi","🥘 Assiettes-types")}${tab("plats","🍽️ Mes plats")}${tab("direct","⌨️ Direct")}</div>
  ${addCard}
  <div class="card">
    <h2>Journal du jour</h2>
    ${(S.flog[nutD]||[]).length?(S.flog[nutD]||[]).map((x,i)=>`<div class="act"><div class="grow"><b>${esc(x.k)}</b><small class="hint" style="display:block">${esc(x.q||"")} · ${Math.round(x.kcal)} kcal · ${Math.round(x.prot)} g prot</small></div><button class="del" data-fd="${i}" aria-label="Supprimer">🗑️</button></div>`).join(""):`<p class="empty">Rien enregistré pour ce jour.</p>`}
  </div>
  <div class="card">
    <h2>Objectifs</h2>
    <div class="kpi">
      <div><label class="lbl">kcal</label><input id="gK" type="number" value="${g.kcal}" inputmode="numeric"></div>
      <div><label class="lbl">Prot g</label><input id="gP" type="number" value="${g.prot}" inputmode="numeric"></div>
      <div><label class="lbl">Eau</label><input id="gE" type="number" min="1" max="20" value="${g.eau}" inputmode="numeric"></div>
    </div>
    <button class="btn" id="gOk" style="margin-top:10px">Enregistrer les objectifs</button>
  </div>`;
  $("nfD").onchange=()=>{nutD=$("nfD").value||today();renderNut()};
  $("eauPlus").onclick=()=>{S.eau[nutD]=(S.eau[nutD]||0)+1;save();renderNut();if(S.eau[nutD]===S.goals.eau)celebrate("💧 Objectif eau atteint !")};
  $("eauMoins").onclick=()=>{S.eau[nutD]=Math.max(0,(S.eau[nutD]||0)-1);save();renderNut()};
  const calcNeeds=()=>{const p=S.profile;const bmr=p.sexe==="femme"?10*p.w+6.25*p.h-5*p.age-161:10*p.w+6.25*p.h-5*p.age+5;
    const af=parseFloat($("calcAct").value)||1.55;const tdee=Math.round(bmr*af);
    const goal=S.profile.goal||"forme";let kcal=tdee;
    if(goal==="poids")kcal=Math.round(tdee*0.85);
    else if(goal==="muscle")kcal=Math.round(tdee*1.1);
    const prot=Math.round(kcal*0.3/4),gluc=Math.round(kcal*0.4/4),lip=Math.round(kcal*0.3/9);
    $("calcRes").innerHTML=`BMR ${Math.round(bmr)} kcal · TDEE ${tdee} kcal<br><b>Objectif suggéré : ${kcal} kcal</b> · ${prot} g prot · ${gluc} g gluc · ${lip} g lip<br><small class="hint">Basé sur ton objectif « ${goal} ».</small>`;
    return {kcal,prot}};
  const ca=$("calcAct");if(ca){ca.value="1.55";ca.onchange=calcNeeds;calcNeeds()}
  const cap=$("calcApply");if(cap)cap.onclick=()=>{const r=calcNeeds();S.goals.kcal=r.kcal;S.goals.prot=r.prot;save();toast("✅ Objectifs nutrition mis à jour");renderNut()};
  document.querySelectorAll("[data-nt]").forEach(b=>b.onclick=()=>{nutTab=b.dataset.nt;renderNut()});
  document.querySelectorAll("[data-asi]").forEach(b=>b.onclick=()=>{const A=ASSIETTES[b.dataset.asi];
    addNut(b.dataset.asi,"1 assiette",A.k[0],A.k[1],A.k[2],A.k[3])});
  const an=$("asiNew");if(an)an.onclick=()=>assiSheet();
  document.querySelectorAll("[data-dishadd]").forEach(b=>b.onclick=()=>{const k=b.dataset.dishadd,D=S.dishes[k];
    const gr=parseFloat(document.querySelector(`[data-dishg="${k}"]`).value);
    if(!(gr>0)){toast("⚠️ Indique le poids en grammes");return}
    addNut(k,fn(gr)+" g",D.k[0]*gr/100,D.k[1]*gr/100,D.k[2]*gr/100,D.k[3]*gr/100)});
  document.querySelectorAll("[data-dishas]").forEach(b=>b.onclick=()=>{const k=b.dataset.dishas,D=S.dishes[k];
    addNut(k,"1 assiette ("+fn(D.p)+" g)",D.k[0]*D.p/100,D.k[1]*D.p/100,D.k[2]*D.p/100,D.k[3]*D.p/100)});
  document.querySelectorAll("[data-dishdel]").forEach(b=>b.onclick=()=>{if(!confirm("Supprimer le plat « "+b.dataset.dishdel+" » ?"))return;
    delete S.dishes[b.dataset.dishdel];save();renderNut()});
  const dn2=$("dishNew");if(dn2)dn2.onclick=()=>dishSheet();
  if(nutTab==="direct"){$("drOk").onclick=()=>{const k=+$("drK").value,p=+$("drP").value,c=+$("drC").value,l=+$("drL").value;
    if(!(k>0)){toast("⚠️ Indique au moins les kcal");return}
    addNut($("drN").value.trim()||"Apports directs","saisie manuelle",k,p,c,l)}}
  document.querySelectorAll("[data-fd]").forEach(b=>b.onclick=()=>{(S.flog[nutD]||[]).splice(+b.dataset.fd,1);if(!S.flog[nutD].length)delete S.flog[nutD];save();renderNut()});
  $("gOk").onclick=()=>{const k=+$("gK").value,p=+$("gP").value,e=Math.max(1,Math.min(20,+$("gE").value||8));
    if(!(k>500&&k<8000&&p>10&&p<400)){toast("⚠️ Objectifs kcal/protéines peu réalistes");return}
    S.goals.kcal=k;S.goals.prot=p;S.goals.eau=e;save();toast("✅ Objectifs mis à jour");renderNut()}}
function assiSheet(){openSheet(`<h3>Créer une assiette-type</h3>
  <label class="lbl">Nom</label><input id="asiN" maxlength="30" placeholder="Ex. Assiette pâtes poulet">
  <div class="kpi" style="margin-top:4px">
    <div><label class="lbl">kcal</label><input id="asiK" type="number" min="50" inputmode="numeric" placeholder="600"></div>
    <div><label class="lbl">Prot g</label><input id="asiP" type="number" min="0" inputmode="numeric" placeholder="40"></div>
    <div><label class="lbl">Gluc g</label><input id="asiC" type="number" min="0" inputmode="numeric" placeholder="60"></div>
  </div>
  <label class="lbl">Lipides g</label><input id="asiL" type="number" min="0" inputmode="numeric" placeholder="20">
  <div class="row" style="margin-top:14px"><button class="btn alt" id="asiC">Annuler</button><button class="btn" id="asiOk">Créer</button></div>`);
  $("asiC").onclick=closeSheet;
  $("asiOk").onclick=()=>{const n=$("asiN").value.trim(),k=+$("asiK").value,p=+$("asiP").value,c=+$("asiC").value,l=+$("asiL").value;
    if(!n||!(k>0)){toast("⚠️ Nom et kcal obligatoires");return}
    ASSIETTES[n]={k:[k,p,c,l]};closeSheet();nutTab="assi";renderNut();toast("✅ Assiette créée")}}
function dishSheet(){openSheet(`<h3>Créer un plat</h3>
  <p class="hint">Valeurs <b>pour 100 g</b> (étiquette ou estimation) + poids d'une assiette pour l'ajout rapide.</p>
  <label class="lbl">Nom</label><input id="diN" maxlength="30" placeholder="Ex. Riz-poulet maison">
  <div class="kpi" style="margin-top:4px">
    <div><label class="lbl">kcal/100g</label><input id="diK" type="number" min="10" inputmode="numeric" placeholder="180"></div>
    <div><label class="lbl">Prot/100g</label><input id="diP" type="number" min="0" inputmode="numeric" placeholder="12"></div>
    <div><label class="lbl">Gluc/100g</label><input id="diC" type="number" min="0" inputmode="numeric" placeholder="25"></div>
  </div>
  <div class="row" style="gap:10px;margin-top:4px">
    <div class="grow"><label class="lbl">Lipides/100g</label><input id="diL" type="number" min="0" inputmode="numeric" placeholder="4"></div>
    <div class="grow"><label class="lbl">1 assiette = g</label><input id="diG" type="number" min="10" inputmode="numeric" placeholder="300"></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn alt" id="diC">Annuler</button><button class="btn" id="diOk">Créer</button></div>`);
  $("diC").onclick=closeSheet;
  $("diOk").onclick=()=>{const n=$("diN").value.trim(),k=+$("diK").value,p=+$("diP").value,c=+$("diC").value,l=+$("diL").value,gr=+$("diG").value;
    if(!n||!(k>0)){toast("⚠️ Nom et kcal/100g obligatoires");return}
    S.dishes[n]={k:[k,p,c,l],p:gr>0?gr:0};closeSheet();nutTab="plats";renderNut();toast("✅ Plat créé")}}

function exDoneKey(){return "exdone-"+today()}

/* renderExos function */
let exSport=null;
function renderExos(){
  const favs=(S.fav&&S.fav.length)?S.fav:["muscu","course"];
  if(!exSport||!favs.includes(exSport))exSport=favs[0];
  const done=getExDone();
  const section=(title,items,cls)=>items.length?`<div class="card"><h2>${title}</h2><div style="display:grid;gap:8px;margin-top:6px">${items.map(x=>{
    const key=x.id,isDone=!!done[key];
    return `<div class="act" style="align-items:flex-start">
      <div class="sico" style="font-size:22px">${x.e}</div>
      <div class="grow">
        <div class="row" style="padding:0"><b>${esc(x.n)}</b><small class="hint">${esc(x.reps)}</small></div>
        <small class="hint" style="display:block;margin-top:2px">${esc(x.d)}</small>
      </div>
      <button type="button" class="chip${isDone?" on":""}" data-ex="${key}" style="min-height:40px;padding:6px 10px;font-size:12px">${isDone?"✓ Fait":"À faire"}</button>
    </div>`}).join("")}</div>`:"";
  const id=exSport;const sp=sportOf(id);const E=EXOS[id]||{warmup:[],main:[],stretch:[]};
  $("scexos").innerHTML=`
  <h1>Exercices</h1><p class="hint">Échauffement, exercices et étirements pour tes sports. Clique sur un sport pour voir ses exercices.</p>
  <div class="chips" style="margin-bottom:12px">${favs.map(x=>{const s=sportOf(x);return `<button type="button" class="chip${x===exSport?" on":""}" data-exsport="${x}">${s.e} ${esc(s.n)}</button>`}).join("")}</div>
  <h2 style="margin:6px 0">${sp.e} ${esc(sp.n)}</h2>
  ${section("🔥 Échauffement",E.warmup||[])}
  ${section("💪 Exercices",E.main||[])}
  ${section("🧘 Étirements",E.stretch||[])}`;
  document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{const o=getExDone();const k=b.dataset.ex;if(o[k])delete o[k];else o[k]=1;setExDone(o);renderExos()});
  document.querySelectorAll("[data-exsport]").forEach(b=>b.onclick=()=>{exSport=b.dataset.exsport;renderExos()})}

/* ===== Cycle ===== */
function cycleState(){return cyclePhase(today())}
const PHASES={regles:{n:"Règles",c:"var(--cyc)",t:"Chaleur douce, marche, étirements. Écoute ton corps avant la charge."},folli:{n:"Phase folliculaire",c:"var(--r2)",t:"Énergie qui remonte — bon moment pour tester des charges ou du volume."},ovu:{n:"Ovulation",c:"var(--prot)",t:"Pic d'énergie fréquent : idéal pour un gros workout. Prudence sur les axes de stabilité."},luteal:{n:"Phase lutéale",c:"var(--r3)",t:"Récupérer compte double : intensité modérée, sommeil et hydratation prioritaires."}};
let cyM=null;/* 1er jour du mois affiché (iso) */
function renderCycle(){const C=S.cycle||{};
  const st=cycleState();
  if(!cyM)cyM=today().slice(0,8)+"01";
  /* grille du mois affiché */
  const ym=cyM.slice(0,7),first=new Date(cyM+"T00:00:00"),dim=new Date(first);dim.setMonth(dim.getMonth()+1);dim.setDate(0);
  const nd=dim.getDate(),off=(first.getDay()+6)%7;
  const monthL=first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  let cal="";
  for(let i=0;i<off;i++)cal+=`<i style="visibility:hidden"></i>`;
  for(let d=1;d<=nd;d++){const dd=ym+"-"+String(d).padStart(2,"0"),ph=cyclePhase(dd),mo=S.mood[dd];
    const cls=ph?PHASES[ph.ph].c:"var(--soft)";
    cal+=`<button type="button" data-cyd="${dd}" aria-label="Humeur du ${d} ${monthL}" style="border:1.5px solid ${dd===today()?"var(--acc)":"transparent"};border-radius:8px;background:${ph?"color-mix(in srgb,"+cls+" 22%,transparent)":"var(--soft)"};min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-family:inherit;padding:2px">
      <b style="font-size:12px;line-height:1">${d}</b><span style="font-size:9px;color:${ph?cls:"transparent"}">${ph?ph.day:"·"}</span>${mo!==undefined?`<span style="font-size:11px;line-height:1">${MOODS[mo]}</span>`:""}</button>`}
  let phHTML="";
  if(st){const P=PHASES[st.ph];
    phHTML=`<div class="card"><h2>Phase du jour</h2>
      <div class="row"><div><div class="num" style="color:${P.c}">Jour ${st.day}</div><p style="margin:2px 0 0"><b>${P.n}</b> · cycle de ${st.cl} j</p></div><em style="font-size:34px;font-style:normal">${st.ph==="regles"?"🌙":st.ph==="ovu"?"⚡":st.ph==="luteal"?"🛌":"🌱"}</em></div>
      <p class="hint" style="margin-top:6px">${P.t}</p></div>
      <div class="card"><button class="btn big" id="cyNow">🌙 J'ai mes règles aujourd'hui</button>
      <p class="hint" style="margin-top:6px">Dernières règles : ${fd(st.last)} (${st.pl} j en moyenne)</p></div>`}
  else phHTML=`<div class="card"><p class="empty">Renseigne le début de tes dernières règles ci-dessous pour lancer le suivi et la prévision.</p></div>`;
  $("sccycle").innerHTML=`
  <h1>Cycle</h1><p class="hint">Prévision de tes phases + humeur du jour, jour par jour.</p>
  ${phHTML}
  <div class="card">
    <h2>Calendrier prévisionnel</h2>
    <div class="row"><button class="del" id="cyPrev" aria-label="Mois précédent">‹</button><b style="text-transform:capitalize">${monthL}</b><button class="del" id="cyNext" aria-label="Mois suivant">›</button></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px">${["L","M","M","J","V","S","D"].map(l=>`<small class="hint" style="text-align:center">${l}</small>`).join("")}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:2px">${cal}</div>
    <p class="hint" style="margin-top:8px">Jour coloré = prévision du cycle (numéro du jour) · emoji = ton humeur. Touche un jour pour changer ton humeur.</p>
  </div>
  <div class="card">
    <h2>Réglages</h2>
    <div class="kpi">
      <div><label class="lbl">Début dernières règles</label><input type="date" id="cyS" value="${st?st.last:""}"></div>
      <div><label class="lbl">Durée règles (j)</label><input type="number" min="1" max="12" id="cyP" value="${C.pl||5}" inputmode="numeric"></div>
      <div><label class="lbl">Durée cycle (j)</label><input type="number" min="20" max="45" id="cyL" value="${C.cl||28}" inputmode="numeric"></div>
    </div>
    <button class="btn" id="cyOk" style="margin-top:10px">Enregistrer</button>
  </div>
  ${C.starts&&C.starts.length?`<div class="card"><h2>Historique</h2><ul style="list-style:none;margin:0;padding:0">${[...C.starts].sort().reverse().slice(0,6).map(d=>`<li style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--soft)"><span>${fd(d)}</span><button class="del" data-cd="${d}" aria-label="Supprimer cette entrée">🗑️</button></li>`).join("")}</ul></div>`:""}`;
  const mv=m=>{const y=+cyM.slice(0,4),mo=+cyM.slice(5,7);const t=new Date(Date.UTC(y,mo-1+m,1));cyM=t.toISOString().slice(0,10);renderCycle()};
  $("cyPrev").onclick=()=>mv(-1);$("cyNext").onclick=()=>mv(1);
  document.querySelectorAll("[data-cyd]").forEach(b=>b.onclick=()=>{const dd=b.dataset.cyd;S.mood=S.mood||{};
    const cur=S.mood[dd];
    if(cur===undefined)S.mood[dd]=0;else if(cur>=4)delete S.mood[dd];else S.mood[dd]=cur+1;
    save();renderCycle();if(S.mood[dd]!==undefined)toast("Humeur du "+fd(dd)+" : "+MOODS[S.mood[dd]])});
  $("cyOk").onclick=()=>{S.cycle=S.cycle||{starts:[],ent:{}};
    const d=$("cyS").value;S.cycle.pl=Math.max(1,Math.min(12,+$("cyP").value||5));S.cycle.cl=Math.max(20,Math.min(45,+$("cyL").value||28));
    if(d&&!S.cycle.starts.includes(d))S.cycle.starts.push(d);
    save();toast("✅ Cycle mis à jour");renderCycle()};
  if($("cyNow"))$("cyNow").onclick=()=>{S.cycle=S.cycle||{starts:[],ent:{}};
    if(!S.cycle.starts.includes(today()))S.cycle.starts.push(today());
    save();toast("🌙 Noté. Repose-toi bien si besoin.");renderCycle()};
  document.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{if(!confirm("Supprimer cette date de début de règles ?"))return;
    S.cycle.starts=S.cycle.starts.filter(x=>x!==b.dataset.cd);save();renderCycle()})}

  </div>
  <div class="card"><h2>Thème & couleur</h2>
    <p class="hint">Choisis un thème ou une couleur d'accent personnalisée.</p>
    <div class="chips" style="margin-top:6px">${Object.keys(ACCENTS).map(k=>{const lk=(k==="gold"&&!S.pantheonComplete);return `<button type="button" class="chip${(S.profile.accent||"lime")===k?" on":""}"${lk?' style="opacity:.4" disabled title="Débloque le Panthéon complet"':""} data-acc="${lk?"":k}">${lk?"🔒":ACCENTS[k].e} ${ACCENTS[k].n}</button>`}).join("")}</div>
    <p class="hint" style="margin:8px 0 4px">Duos predefinis :</p>
    <div class="chips" style="margin-bottom:8px">${DUOS.map(d=>`<button type="button" class="chip${(S.profile.duo||"nuit")===d.id?" on":""}" data-duo="${d.id}" style="min-height:40px">${d.e} ${d.n}</button>`).join("")}</div>
    <div class="row" style="margin-top:10px;gap:8px">
      <label class="lbl" style="margin:0;align-self:center">Fond (primaire)</label>
      <input type="color" id="primCustom" value="${S.profile.primary||"#0a0a0c"}" style="width:48px;height:44px;border:0;background:none;cursor:pointer">
      <button type="button" class="btn alt" id="primReset" style="min-height:44px;padding:6px 10px;font-size:12px">Réinitialiser</button>
    </div>
    <div class="row" style="margin-top:10px;gap:8px">
      <label class="lbl" style="margin:0;align-self:center">Couleur libre (accent)</label>
      <input type="color" id="accCustom" value="${/^#[0-9a-f]{6}$/i.test(S.profile.accent||"")?S.profile.accent:"#ccff00"}" style="width:48px;height:44px;border:0;background:none;cursor:pointer">
    </div>
  </div>
  <div class="card"><h2>Badges — ${S.badges.length+S.bx.length} gagnés</h2>
    <div style="display:grid;gap:8px">${BADGES.map(b=>`<div class="bdg${S.badges.includes(b.id)?"":" off"}"><em>${b.e}</em><div class="grow"><b>${b.n}</b><small class="hint" style="display:block">${b.d}</small></div></div>`).join("")}</div>
    
    ${perfBadges().filter(b=>b.earned||true).length?`<p class="hint" style="margin:12px 0 4px">Badges de performance :</p>
    <div style="display:grid;gap:8px">${perfBadges().map(b=>`<div class="bdg${b.earned?"":" off"}"><em>${b.e}</em><div class="grow"><b>${b.n}</b><small class="hint" style="display:block">${b.d}</small></div></div>`).join("")}</div>`:""}
  </div>
  <div class="card"><h2>🏛️ Panthéon — ${((S.pantheon||[]).length)}/${(S.fav||[]).filter(x=>x!=="autre").length} dieux</h2>
    <p class="hint">Finalise un sport (tous ses badges) pour débloquer sa divinité. Du moins puissant au plus puissant.</p>
    <div style="display:grid;gap:8px;margin-top:10px">
      ${DEITIES.map((d,i)=>{
        const unlocked=(S.pantheon||[]).length>i;
        const sportId=unlocked?(S.pantheon||[])[i]:null;
        const sp=sportId?sportOf(sportId):null;
        return `<div class="bdg${unlocked?"":" off"}" style="${unlocked?"border:1.5px solid var(--acc);background:var(--acc-soft)":""}">
          <em style="font-size:24px">${unlocked?d.e:"🔒"}</em>
          <div class="grow"><b>${unlocked?d.n:"???"}</b><small class="hint" style="display:block">${unlocked?d.title+" — "+(sp?sp.e+" "+esc(sp.n):""):"Finalise un sport pour débloquer"}</small></div>
          ${unlocked?"<small class='hint'>✓</small>":""}
        </div>`;
      }).join("")}
    </div>
    ${S.pantheonComplete?`<div class="card" style="margin-top:12px;background:linear-gradient(135deg,var(--acc-soft),transparent);border:1.5px solid var(--acc)">
      <div class="row"><em style="font-size:32px">⚡</em><div class="grow"><b style="color:var(--acc-text)">PANTHÉON COMPLET</b><small class="hint" style="display:block">Tu es devenu un Dieu du sport. Tous tes sports sont finalisés.</small></div><b style="color:var(--acc)">✓</b></div>
    </div>`:""}
  </div>

  <div class="card"><h2>Sauvegarde</h2>
    <p class="hint">Toutes tes données restent sur cet appareil. Exporte régulièrement pour ne rien perdre.</p>
    <button class="btn alt" id="expF">⬇️ Exporter dans un fichier</button>
    <button class="btn alt" id="expC" style="margin-top:8px">📋 Copier dans le presse-papiers</button>
    <button class="btn alt" id="impF" style="margin-top:8px">⬆️ Importer depuis un fichier</button>
    <input type="file" id="impFi" accept=".json,application/json" hidden>
    <button class="btn alt" id="impT" style="margin-top:8px">📥 Importer depuis un texte</button>
    <div id="impW" hidden style="margin-top:10px"><textarea id="impTt" rows="4" placeholder="Colle ici ta sauvegarde JSON…" aria-label="Sauvegarde JSON"></textarea><button class="btn" id="impOk" style="margin-top:8px">Restaurer</button></div>
  </div>
  <div class="card"><h2>Compte</h2>
    <button class="btn alt big" id="swAcc">🔁 Changer de compte</button>
    <button class="btn dgr big" id="reset" style="margin-top:8px">🗑️ Effacer les données de ce compte</button>
  </div>
  <p class="hint" style="text-align:center;margin:14px 0 6px">Élan ⚡ — carnet sportif 100 % privé, hors ligne.<br>Muscu · Course · Vélo · Natation · Padel · et tout ce que tu inventes.</p>`;
  $("tt").onclick=toggleTheme;
  $("pOk").onclick=()=>{const age=+$("pAge").value,h=+$("pH").value,w=+$("pW").value;
    if(!((age>=10&&age<=99)||!age)||!(!h||(h>=120&&h<=230))||!(!w||(w>=30&&w<=250))){toast("⚠️ Valeurs peu réalistes");return}
    S.profile.age=age||S.profile.age;S.profile.h=h||S.profile.h;S.profile.sexe=$("pSex").value;
    if(w>0){S.profile.w=w;const last=S.wlog[S.wlog.length-1];
      if(last&&last.d===today())last.kg=w;else S.wlog.push({d:today(),kg:w});
      S.wlog.sort((a,b)=>a.d.localeCompare(b.d))}
    save();toast("✅ Profil mis à jour");renderAll()};
  document.querySelectorAll("[data-nl]").forEach(b=>b.onclick=()=>{const id=b.dataset.nl;
    lvlSet(id,lvlOf(id)+ +b.dataset.d);renderProfil()});
  document.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>{if(!b.dataset.acc||(b.dataset.acc==="gold"&&!S.pantheonComplete))return;applyAccent(b.dataset.acc);renderProfil()});
  document.querySelectorAll("[data-duo]").forEach(b=>b.onclick=()=>{applyDuo(b.dataset.duo);renderProfil()});
  const ac=$("accCustom");if(ac)ac.onchange=()=>{applyAccent(ac.value);renderProfil()}
  const pc=$("primCustom");if(pc)pc.onchange=()=>{applyPrimary(pc.value);renderProfil()}
  const pr=$("primReset");if(pr)pr.onclick=()=>{applyPrimary(null);renderProfil()}
  $("gOk").onclick=()=>{const s=Math.max(1,Math.min(30,+$("gS").value||3)),m=Math.max(30,+$("gM").value||180);S.goals.ses=s;S.goals.min=m;S.goals.eau=Math.max(1,Math.min(20,+$("gE").value||8));
    S.profile.goal=$("gGoal").value;
    S.goals.per=S.goals.per||{};document.querySelectorAll("[data-gsp]").forEach(inp=>{S.goals.per[inp.dataset.gsp]=Math.max(0,Math.min(14,+inp.value||0))});
    const sum=Object.values(S.goals.per).reduce((a,b)=>a+b,0);if(sum>0)S.goals.ses=sum;
    save();toast("✅ Objectifs mis à jour");renderProfil()};
  document.querySelectorAll("[data-fv]").forEach(b=>b.onclick=()=>{const id=b.dataset.fv;S.fav=S.fav||[];
    S.fav.includes(id)?S.fav=S.fav.filter(x=>x!==id):S.fav.push(id);save();renderProfil()});
  $("csNew").onclick=sportSheet;
  $("expF").onclick=()=>{const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify({app:"elan",v:1,name:NAME,S},null,1));a.download="elan-"+NAME+"-"+today()+".json";a.click()};
  $("expC").onclick=()=>{navigator.clipboard.writeText(JSON.stringify({app:"elan",v:1,name:NAME,S})).then(()=>toast("📋 Copié !")).catch(()=>toast("⚠️ Copie impossible"))};
  $("impF").onclick=()=>$("impFi").click();
  $("impFi").onchange=()=>{const f=$("impFi").files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{if(confirm("Remplacer les données de ce compte par celles du fichier ?"))doImport(r.result)};r.readAsText(f)};
  $("impT").onclick=()=>{const w=$("impW");w.hidden=!w.hidden;if(!w.hidden)$("impTt").focus()};
  $("impOk").onclick=()=>doImport($("impTt").value);
  $("swAcc").onclick=()=>{localStorage.removeItem("el-session");showAuth(false)};
  $("reset").onclick=()=>{if(!confirm("Effacer TOUTES les données de "+NAME+" ? Impossible d'annuler."))return;
    localStorage.removeItem("el-v1:"+NAME);localStorage.removeItem("el-session");location.reload()}}
function doImport(txt){try{const o=JSON.parse(txt);const NS=o&&o.app==="elan"?o.S:o&&o.el?o.el:null;
  if(!NS||typeof NS!=="object")throw 0;
  S=Object.assign(fresh(),NS);save();toast("✅ Données restaurées");renderAll();renderProfil()}catch(e){toast("⚠️ Sauvegarde invalide")}}
function sportSheet(){openSheet(`<h3>Créer un sport</h3>
  <label class="lbl">Nom</label><input id="csN" maxlength="24" placeholder="Ex. CrossFit, Pétanque…">
  <label class="lbl">Icône</label><div class="chips" id="csE">${["✨","🥊","⛳","🎳","🏓","🪩","⛷️","🛹","🤿","🧘"].map(e=>`<button type="button" class="chip" data-e="${e}">${e}</button>`).join("")}</div>
  <label class="lbl">On mesure</label><select id="csK"><option value="dur">la durée</option><option value="dist">la durée + la distance</option></select>
  <div class="row" style="margin-top:14px"><button class="btn alt" id="csC">Annuler</button><button class="btn" id="csOk">Créer</button></div>`);
  let em="✨";document.querySelectorAll("#csE button").forEach(b=>b.onclick=()=>{em=b.dataset.e;document.querySelectorAll("#csE button").forEach(x=>x.classList.toggle("on",x===b))});
  $("csC").onclick=closeSheet;
  $("csOk").onclick=()=>{const n=$("csN").value.trim();if(!n){toast("⚠️ Donne un nom à ton sport");return}
    const sp={id:"c"+uid(),n:n,e:em,kind:$("csK").value,met:6};
    S.sports.push(sp);S.fav=S.fav||[];S.fav.push(sp.id);save();closeSheet();toast("✅ "+em+" "+n+" ajouté !");renderProfil()}}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>setScreen(b.dataset.t));

/* ===== Démarrage ===== */
function start(n){NAME=n;loadS();migrate();theme();applyPrimary((S.profile&&S.profile.primary)||null);applyAccent((S.profile&&S.profile.accent)||"lime");
  if(!S.profile.done){showOnb();return}
  $("auth").hidden=true;$("onb").hidden=true;$("app").hidden=false;$("tabbar").hidden=false;setScreen("today")}
(function(){theme();
  const A=accs(),ses=localStorage.getItem("el-session");
  if(!Object.keys(A).length)showAuth(true);
  else if(ses&&A[ses])start(ses);
  else showAuth(false);
  if("serviceWorker" in navigator)try{navigator.serviceWorker.register("./sw.js")}catch(e){}
})();
</script>
</body>
</html>
